<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Tug of War - Player</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Kanit', sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; text-align: center; }

        input[type="text"] { width: 100%; padding: 15px; font-size: 1.3em; font-family: 'Kanit'; border-radius: 12px; border: 2px solid #38bdf8; background: #1e293b; color: white; margin-bottom: 20px; text-align: center; }
        
        .team-btn { width: 100%; padding: 20px; font-size: 1.5em; font-family: 'Kanit'; font-weight: bold; border: none; border-radius: 15px; margin-bottom: 15px; color: white; cursor: pointer; }
        .team-red { background: #ef4444; }
        .team-blue { background: #3b82f6; }
        
        #quiz-screen, #result-screen, #waiting-screen { display: none; }

        .grid-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .choice-btn { background: #1e293b; border: 2px solid #475569; color: white; padding: 20px; font-size: 1.3em; font-family: 'Kanit'; font-weight: bold; border-radius: 12px; }
        .choice-btn:disabled { opacity: 0.4; }

        .top-status { display: flex; justify-content: space-between; background: #1e293b; padding: 15px; border-radius: 12px; font-size: 1.2em; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- Step 1: กรอกชื่อและเลือกทีม -->
    <div id="setup-screen">
        <h2>กรอกชื่อของคุณ</h2>
        <input type="text" id="player-name" placeholder="ใส่ชื่อเล่นตรงนี้..." maxlength="12">
        
        <h3>เลือกทีมที่ต้องการเข้าร่วม</h3>
        <button class="team-btn team-red" onclick="joinGame('RED')">🔴 TEAM RED (<span id="red-num">0</span>/16)</button>
        <button class="team-btn team-blue" onclick="joinGame('BLUE')">🔵 TEAM BLUE (<span id="blue-num">0</span>/16)</button>
    </div>

    <!-- Step 2: หน้ารอหลังเข้าทีมสำเร็จ -->
    <div id="waiting-screen">
        <h1 id="welcome-text"></h1>
        <p style="font-size: 1.2em; color: #94a3b8;">ชื่อของคุณขึ้นไปอยู่บนหน้าผาแล้ว!</p>
        <p style="font-size: 1.5em; color: #facc15;">โปรดมองหน้าจอหลักเพื่อรอเริ่มแข่ง...</p>
    </div>

    <!-- Step 3: หน้าทำโจทย์ -->
    <div id="quiz-screen">
        <div class="top-status">
            <span id="display-team">TEAM</span>
            <span>⏱️ <span id="timer">15</span> วิ</span>
        </div>
        <h2 id="q-text" style="background:#1e293b; padding:20px; border-radius:12px;">กำลังรอโจทย์...</h2>
        <div class="grid-choices">
            <button class="choice-btn" id="c0" onclick="sendAns(0)">A</button>
            <button class="choice-btn" id="c1" onclick="sendAns(1)">B</button>
            <button class="choice-btn" id="c2" onclick="sendAns(2)">C</button>
            <button class="choice-btn" id="c3" onclick="sendAns(3)">D</button>
        </div>
    </div>

    <!-- Step 4: ผลลัพธ์ -->
    <div id="result-screen">
        <h1 id="res-icon" style="font-size: 4em; margin: 10px 0;"></h1>
        <h2 id="res-title"></h2>
        <h1 id="res-power" style="color: #facc15; font-size: 3em;">💪 0</h1>
    </div>

    <script>
        const socket = io();
        let myTeam = '';

        socket.on('update_lobby', (data) => {
            document.getElementById('red-num').innerText = data.red.length;
            document.getElementById('blue-num').innerText = data.blue.length;
        });

        function joinGame(team) {
            const name = document.getElementById('player-name').value;
            if (!name.trim()) return alert('กรุณากรอบชื่อก่อนเข้าเล่นครับ!');
            
            socket.emit('join_game', { name, team });
        }

        socket.on('join_error', (msg) => alert(msg));

        socket.on('join_success', (data) => {
            myTeam = data.team;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('waiting-screen').style.display = 'block';
            document.getElementById('welcome-text').innerText = `ยินดีต้อนรับ ${data.name}!`;
            document.getElementById('welcome-text').style.color = myTeam === 'RED' ? '#ef4444' : '#3b82f6';
        });

        socket.on('new_question', (data) => {
            document.getElementById('waiting-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';

            document.getElementById('q-text').innerText = data.questionData.q;
            document.getElementById('display-team').innerText = myTeam === 'RED' ? '🔴 RED TEAM' : '🔵 BLUE TEAM';

            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`c${i}`);
                btn.innerText = data.questionData.choices[i];
                btn.disabled = false;
                btn.style.background = '#1e293b';
            }
        });

        socket.on('timer_tick', (t) => {
            document.getElementById('timer').innerText = t;
        });

        function sendAns(idx) {
            socket.emit('submit_answer', idx);
            for (let i = 0; i < 4; i++) {
                document.getElementById(`c${i}`).disabled = true;
            }
            document.getElementById(`c${idx}`).style.background = '#f59e0b';
        }

        socket.on('answer_result', (data) => {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            document.getElementById('res-icon').innerText = data.isCorrect ? '✅' : '❌';
            document.getElementById('res-title').innerText = data.isCorrect ? 'ถูกต้อง!' : 'ตอบผิด!';
            document.getElementById('res-power').innerText = `💪 แรงดึง: ${data.power}`;
        });
    </script>
</body>
</html>
