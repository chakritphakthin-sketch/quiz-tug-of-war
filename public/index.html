<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play - Quiz Tug of War</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        
        /* หน้าเลือกทีม */
        #join-screen { margin-top: 50px; }
        .team-btn { width: 100%; padding: 30px; font-size: 2em; font-family: 'Kanit'; font-weight: bold; border: none; border-radius: 15px; margin-bottom: 20px; color: white; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.2s; }
        .team-btn.red { background: #e74c3c; }
        .team-btn.blue { background: #3498db; }
        .team-btn:active { transform: scale(0.95); }

        /* หน้าเล่นเกม */
        #quiz-screen { display: none; }
        .top-bar { display: flex; justify-content: space-between; font-size: 1.2em; font-weight: bold; margin-bottom: 20px; padding: 15px; border-radius: 10px; color: white; }
        
        .question-text { font-size: 1.5em; font-weight: bold; margin-bottom: 30px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .grid-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .choice-btn { background: #fff; border: 3px solid #ddd; padding: 30px 10px; font-size: 1.5em; font-family: 'Kanit'; font-weight: bold; border-radius: 15px; cursor: pointer; transition: 0.2s; color: #333; }
        .choice-btn:active { background: #f1c40f; border-color: #f39c12; color: white; transform: scale(0.95); }
        .choice-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* หน้าแสดงผลลัพธ์การดึง */
        #result-screen { display: none; margin-top: 50px; }
        .result-icon { font-size: 5em; margin-bottom: 10px; }
        .power-text { font-size: 3em; font-weight: bold; color: #e67e22; }
    </style>
</head>
<body>

    <div id="join-screen">
        <h2>เลือกทีมของคุณ</h2>
        <button class="team-btn red" onclick="joinTeam('RED')">🔴 TEAM RED</button>
        <button class="team-btn blue" onclick="joinTeam('BLUE')">🔵 TEAM BLUE</button>
    </div>

    <div id="quiz-screen">
        <div class="top-bar" id="team-bar">
            <span id="my-team-text">TEAM</span>
            <span>⏱️ <span id="mobile-timer">15</span></span>
        </div>
        <div class="question-text" id="q-text">รอคำถามจากหน้าจอหลัก...</div>
        
        <div class="grid-choices">
            <button class="choice-btn" id="btn-0" onclick="submitAnswer(0)">A. -</button>
            <button class="choice-btn" id="btn-1" onclick="submitAnswer(1)">B. -</button>
            <button class="choice-btn" id="btn-2" onclick="submitAnswer(2)">C. -</button>
            <button class="choice-btn" id="btn-3" onclick="submitAnswer(3)">D. -</button>
        </div>
    </div>

    <div id="result-screen">
        <div class="result-icon" id="res-icon">✅</div>
        <h2 id="res-msg">ถูกต้อง!</h2>
        <div style="font-size: 1.5em; color: #555;">คุณใช้เวลา <span id="res-time">0</span> วิ</div>
        <br>
        <div>แรงที่คุณสร้างให้ทีม</div>
        <div class="power-text" id="res-power">💪 0</div>
    </div>

    <script>
        const socket = io();
        let myTeam = '';

        function joinTeam(team) {
            myTeam = team;
            socket.emit('join_team', team);
            
            document.getElementById('join-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            
            const bar = document.getElementById('team-bar');
            bar.style.backgroundColor = team === 'RED' ? '#e74c3c' : '#3498db';
            document.getElementById('my-team-text').innerText = team === 'RED' ? '🔴 TEAM RED' : '🔵 TEAM BLUE';
        }

        // รับคำถามใหม่จากเซิร์ฟเวอร์
        socket.on('new_question', (data) => {
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            
            document.getElementById('q-text').innerText = data.questionData.q;
            
            // อัปเดตตัวเลือก และ ปลดล็อกปุ่ม
            for(let i=0; i<4; i++) {
                const btn = document.getElementById(`btn-${i}`);
                btn.innerText = data.questionData.choices[i];
                btn.disabled = false;
                btn.style.background = '#fff';
            }
        });

        socket.on('timer_tick', (timeLeft) => {
            document.getElementById('mobile-timer').innerText = timeLeft;
        });

        // ส่งคำตอบ และ ล็อกหน้าจอทันที!
        function submitAnswer(index) {
            socket.emit('submit_answer', index);
            
            // ล็อกปุ่มทั้งหมด
            for(let i=0; i<4; i++) {
                document.getElementById(`btn-${i}`).disabled = true;
            }
            // ไฮไลท์ปุ่มที่กด
            document.getElementById(`btn-${index}`).style.background = '#f1c40f';
        }

        // รับผลการคำนวณแรงจากเซิร์ฟเวอร์
        socket.on('answer_result', (data) => {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            if (data.isCorrect) {
                document.getElementById('res-icon').innerText = '✅';
                document.getElementById('res-msg').innerText = 'ถูกต้อง!';
                document.getElementById('res-msg').style.color = '#2ecc71';
            } else {
                document.getElementById('res-icon').innerText = '❌';
                document.getElementById('res-msg').innerText = 'ผิด!';
                document.getElementById('res-msg').style.color = '#e74c3c';
            }

            document.getElementById('res-time').innerText = data.timeTaken;
            document.getElementById('res-power').innerText = `💪 ${data.power}`;
        });
    </script>
</body>
</html>
