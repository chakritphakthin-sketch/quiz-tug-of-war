<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Tug of War - Player View</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: #0f172a; color: white; height: 100vh; width: 100vw; overflow: hidden; position: relative; }

        .camera-viewport { position: absolute; width: 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; }
        
        /* ฉากหลังเคลื่อนที่ตามตัวละคร (World Stage) */
        .world-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .dirt-path { position: absolute; top: 18%; bottom: 18%; left: -2000px; right: -2000px; background: #78350f; border-top: 6px solid #451a03; border-bottom: 6px solid #451a03; }
        
        /* เส้นกึ่งกลางสนาม (ฟิกซ์ตรงกลางโลกเสมอ) */
        .center-mark { position: absolute; left: 50%; top: 0; bottom: 0; width: 8px; background: rgba(255,255,255,0.9); transform: translateX(-50%); border-left: 2px dashed #dc2626; z-index: 10; pointer-events: none; }

        /* เชือกและผู้เล่น */
        .rope-slider { position: absolute; top: 50%; left: 50%; width: 3000px; height: 120px; transform: translate(-50%, -50%); transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        .rope-texture { position: absolute; top: 50%; left: 0; right: 0; height: 18px; transform: translateY(-50%); background: repeating-linear-gradient(45deg, #d4a373, #d4a373 8px, #a8794d 8px, #a8794d 16px); box-shadow: 0 8px 12px rgba(0,0,0,0.6); border-radius: 10px; z-index: 5; }
        .knot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; background: #dc2626; border-radius: 6px; border: 3px solid #fff; z-index: 6; box-shadow: 0 0 10px rgba(0,0,0,0.5); }

        /* ตัวละครและท่าจับเชือก */
        .player-top-down { position: absolute; width: 50px; height: 50px; z-index: 20; transition: transform 0.1s; }
        .player-head { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #000; box-shadow: 0 6px 10px rgba(0,0,0,0.5); background-image: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.4), transparent); position: absolute; top: 4px; left: 4px; z-index: 8; }
        .red-team .player-head { background-color: #ef4444; }
        .blue-team .player-head { background-color: #3b82f6; }

        .hand { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #fcd34d; border: 2px solid #000; z-index: 7; }

        .pos-top { top: calc(50% - 65px); }
        .pos-bottom { top: calc(50% + 15px); }

        /* ท่าเอนตัวจับเชือก */
        .red-team { transform: rotate(-15deg); }
        .red-team.pos-top .hand-1 { top: 58px; left: 10px; }
        .red-team.pos-top .hand-2 { top: 58px; left: -10px; }
        .red-team.pos-bottom .hand-1 { top: -18px; left: 10px; }
        .red-team.pos-bottom .hand-2 { top: -18px; left: -10px; }

        .blue-team { transform: rotate(15deg); }
        .blue-team.pos-top .hand-1 { top: 58px; right: 10px; }
        .blue-team.pos-top .hand-2 { top: 58px; right: -10px; }
        .blue-team.pos-bottom .hand-1 { top: -18px; right: 10px; }
        .blue-team.pos-bottom .hand-2 { top: -18px; right: -10px; }

        .player-name { position: absolute; background: rgba(0,0,0,0.85); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; white-space: nowrap; border: 1px solid rgba(255,255,255,0.3); z-index: 12; left: 50%; transform: translateX(-50%); }
        .pos-top .player-name { top: -22px; }
        .pos-bottom .player-name { bottom: -22px; }

        /* ป้ายไฮไลต์ตัวละครผู้เล่น */
        .is-me { z-index: 40 !important; }
        .is-me .player-head { border: 3px solid #facc15; box-shadow: 0 0 15px #facc15; }
        .you-badge { position: absolute; background: #facc15; color: #000; font-weight: 900; padding: 1px 6px; border-radius: 4px; font-size: 10px; z-index: 30; border: 1px solid #000; left: 50%; transform: translateX(-50%); animation: bounce 0.8s infinite alternate; }
        .pos-top .you-badge { top: -38px; }
        .pos-bottom .you-badge { bottom: -38px; }
        @keyframes bounce { 0% { transform: translate(-50%, 0); } 100% { transform: translate(-50%, -4px); } }

        /* Top HUD */
        .top-hud-bar { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; pointer-events: none; }
        .pin-pill { background: rgba(0,0,0,0.75); border: 1px solid rgba(255,255,255,0.2); padding: 6px 16px; border-radius: 20px; font-family: 'Orbitron'; font-size: 1.1em; color: #facc15; }
        
        /* Card & Overlay */
        .overlay-card { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 24px; padding: 25px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); z-index: 200; }
        input { width: 100%; padding: 12px; font-size: 1.1em; font-family: 'Kanit'; font-weight: bold; border-radius: 12px; border: 2px solid #38bdf8; background: rgba(0,0,0,0.6); color: #fff; margin-bottom: 10px; text-align: center; outline: none; }
        .btn-3d { width: 100%; padding: 14px; font-size: 1.2em; font-family: 'Kanit'; font-weight: 900; border: none; border-radius: 14px; margin-bottom: 8px; color: white; cursor: pointer; }
        .team-red { background: linear-gradient(180deg, #ff4d4d, #d10000); box-shadow: 0 4px 0 #8a0000; }
        .team-blue { background: linear-gradient(180deg, #4da6ff, #0066cc); box-shadow: 0 4px 0 #004080; }

        /* แผง UI เลือกทีมด้านล่างแบบ PB */
        #bottom-lobby-ui { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px 15px; background: linear-gradient(0deg, rgba(0,0,0,0.95) 40%, rgba(0,0,0,0.6) 80%, transparent); z-index: 150; display: none; }
        .pb-team-select { display: flex; gap: 10px; margin-bottom: 10px; }
        .pb-panel { flex: 1; text-align: center; }
        .btn-pb { width: 100%; padding: 12px 5px; font-size: 1em; font-family: 'Kanit'; font-weight: 900; border: 2px solid #fff; border-radius: 8px; color: white; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }
        .btn-pb.red { background: linear-gradient(180deg, #dc2626, #991b1b); }
        .btn-pb.blue { background: linear-gradient(180deg, #2563eb, #1e3a8a); }
        .pb-count { font-family: 'Orbitron'; font-size: 1.2em; font-weight: bold; margin-top: 6px; color: #fff; text-shadow: 0 2px 4px #000; }

        /* แผงตอบคำถาม */
        #quiz-overlay { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 500px; z-index: 200; display: none; }
        .q-card { background: rgba(15, 23, 42, 0.95); border: 2px solid #38bdf8; border-radius: 20px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; }
        .q-title { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; }
        .grid-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .choice-btn { background: #1e293b; border: 2px solid #475569; color: white; padding: 12px 6px; font-size: 1em; font-family: 'Kanit'; font-weight: bold; border-radius: 12px; cursor: pointer; }
        .choice-btn.selected { background: #facc15; color: #000; border-color: #fff; }
    </style>
</head>
<body>

    <div class="top-hud-bar">
        <div class="pin-pill">PIN: <span id="pin-hud">------</span></div>
        <div style="font-family:'Orbitron'; font-size: 1.5em; color:#00ffcc;" id="timer-hud">15</div>
    </div>

    <div class="camera-viewport">
        <div class="world-stage" id="world-stage">
            <div class="dirt-path"></div>
            <div class="center-mark"></div>
            
            <div class="rope-slider" id="rope-slider">
                <div class="rope-texture"></div>
                <div class="knot"></div>
                <div id="players-container"></div>
            </div>
        </div>
    </div>

    <!-- หน้าต่าง Join -->
    <div id="join-card" class="overlay-card">
        <h2 style="color: #38bdf8; margin-bottom: 12px;">🎮 สมรภูมิดึงเชือก</h2>
        <input type="number" id="pin-input" placeholder="กรอกรหัส PIN 6 หลัก">
        <input type="text" id="name-input" placeholder="ตั้งชื่อตัวละคร..." maxlength="12">
        
        <p style="margin-bottom: 8px; font-weight: bold; font-size: 0.9em;">เลือกทีมแข่ง</p>
        <button class="btn-3d team-red" onclick="joinRoom('RED')">🔴 TEAM RED</button>
        <button class="btn-3d team-blue" onclick="joinRoom('BLUE')">🔵 TEAM BLUE</button>
    </div>

    <!-- ปุ่มเลือกทีมแบบ PB ย้ายลงล่าง -->
    <div id="bottom-lobby-ui">
        <div class="pb-team-select">
            <div class="pb-panel">
                <button class="btn-pb red" onclick="changeTeam('RED')">🔴 เข้าร่วม RED</button>
                <div class="pb-count" id="pb-red-count">0 / 16</div>
            </div>
            <div class="pb-panel">
                <button class="btn-pb blue" onclick="changeTeam('BLUE')">🔵 เข้าร่วม BLUE</button>
                <div class="pb-count" id="pb-blue-count">0 / 16</div>
            </div>
        </div>
        <div style="text-align: center; color: #00ffcc; font-size: 1em; font-weight: bold;">
            ⏳ รอ Host กดเริ่มการแข่งขัน...
        </div>
    </div>

    <!-- แผงคำตอบ -->
    <div id="quiz-overlay">
        <div class="q-card">
            <div class="q-title" id="q-text">กำลังโหลดโจทย์...</div>
            <div class="grid-choices">
                <button class="choice-btn" id="c0" onclick="sendAns(0)">A</button>
                <button class="choice-btn" id="c1" onclick="sendAns(1)">B</button>
                <button class="choice-btn" id="c2" onclick="sendAns(2)">C</button>
                <button class="choice-btn" id="c3" onclick="sendAns(3)">D</button>
            </div>
        </div>
    </div>

    <!-- ผลลัพธ์ -->
    <div id="result-card" class="overlay-card" style="display:none;">
        <h1 id="res-icon" style="font-size: 3.5em;"></h1>
        <h2 id="res-title"></h2>
        <h1 id="res-power" style="color: #facc15; font-size: 2.5em; margin-top: 10px;">💪 +0</h1>
    </div>

    <script>
        const socket = io();
        let myId = '';
        let currentRoomCode = '';
        let myTeam = '';
        let myName = '';
        let mySlot = 0;
        let currentRopePos = 50;

        function joinRoom(team) {
            const pin = document.getElementById('pin-input').value;
            const name = document.getElementById('name-input').value;

            if (!pin || pin.length !== 6) return alert('กรอกรหัส PIN 6 หลักก่อนครับ!');
            if (!name.trim()) return alert('ตั้งชื่อก่อนเข้าเล่นครับ!');

            myTeam = team; myName = name; currentRoomCode = pin;
            socket.emit('join_room', { roomCode: pin, name, team });
        }

        function changeTeam(targetTeam) {
            if (myTeam === targetTeam) return;
            socket.emit('change_team', { roomCode: currentRoomCode, targetTeam });
        }

        socket.on('join_error', (msg) => alert(msg));

        socket.on('join_success', (data) => {
            myId = data.id;
            mySlot = data.slot;
            document.getElementById('join-card').style.display = 'none';
            document.getElementById('bottom-lobby-ui').style.display = 'block';
            document.getElementById('pin-hud').innerText = currentRoomCode;
        });

        socket.on('team_switched', (data) => {
            myTeam = data.team;
            mySlot = data.slot;
        });

        socket.on('update_lobby', (data) => {
            const container = document.getElementById('players-container');
            container.innerHTML = '';
            
            let redNum = 0; let blueNum = 0;
            if (data.ropePosition !== undefined) currentRopePos = data.ropePosition;

            data.players.forEach(p => {
                const charDiv = document.createElement('div');
                const isTop = (p.slot % 2 === 0);
                const posClass = isTop ? 'pos-top' : 'pos-bottom';
                const isMe = (p.id === myId || (p.name === myName && p.team === myTeam));
                
                charDiv.className = `player-top-down ${p.team === 'RED' ? 'red-team' : 'blue-team'} ${posClass} ${isMe ? 'is-me' : ''}`;
                
                // เว้นระยะจากกลางเชือก 130px
                const offset = 130 + (p.slot * 55);
                if (p.team === 'RED') {
                    charDiv.style.left = `calc(50% - ${offset}px)`;
                    redNum++;
                } else {
                    charDiv.style.left = `calc(50% + ${offset}px)`;
                    blueNum++;
                }

                charDiv.innerHTML = `
                    ${isMe ? '<div class="you-badge">YOU</div>' : ''}
                    <div class="player-name">${p.name}</div>
                    <div class="player-head"></div>
                    <div class="hand hand-1"></div>
                    <div class="hand hand-2"></div>
                `;
                container.appendChild(charDiv);
            });

            document.getElementById('pb-red-count').innerText = `${redNum} / 16`;
            document.getElementById('pb-blue-count').innerText = `${blueNum} / 16`;

            updateCameraLock();
        });

        // ระบบ Camera Lock: ขยับกล้องล็อกเป้าไว้ที่ตัวผู้เล่นให้อยู่กลางจอมือถือเสมอ
        function updateCameraLock() {
            const worldStage = document.getElementById('world-stage');
            const ropeSlider = document.getElementById('rope-slider');

            const ropeShiftPx = (currentRopePos - 50) * 10;
            ropeSlider.style.transform = `translate(-50%, -50%) translateX(${ropeShiftPx}px)`;

            if (myTeam) {
                const isRed = (myTeam === 'RED');
                const playerOffsetPx = isRed ? -(130 + mySlot * 55) : (130 + mySlot * 55);
                
                // ระยะ X ของตัวเราเทียบกับจุดศูนย์กลางโลก
                const totalPlayerX = ropeShiftPx + playerOffsetPx;

                // เลื่อน World Stage สวนทาง เพื่อให้ตัวละครเราอยู่กลางจอพอดี
                worldStage.style.transform = `translateX(${-totalPlayerX}px)`;
            }
        }

        socket.on('new_question', (data) => {
            document.getElementById('bottom-lobby-ui').style.display = 'none';
            document.getElementById('result-card').style.display = 'none';
            document.getElementById('quiz-overlay').style.display = 'block';

            document.getElementById('q-text').innerText = `ข้อที่ ${data.questionIndex + 1}: ${data.questionData.q}`;

            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`c${i}`);
                btn.innerText = data.questionData.choices[i];
                btn.disabled = false;
                btn.className = 'choice-btn';
            }
        });

        socket.on('timer_tick', (t) => { 
            document.getElementById('timer-hud').innerText = t < 10 ? `0${t}` : t; 
        });

        function sendAns(idx) {
            socket.emit('submit_answer', { roomCode: currentRoomCode, answerIndex: idx });
            for (let i = 0; i < 4; i++) { document.getElementById(`c${i}`).disabled = true; }
            document.getElementById(`c${idx}`).classList.add('selected');
        }

        socket.on('update_rope', (data) => {
            currentRopePos = data.ropePosition;
            updateCameraLock();
        });

        socket.on('answer_result', (data) => {
            setTimeout(() => {
                document.getElementById('quiz-overlay').style.display = 'none';
                document.getElementById('result-card').style.display = 'block';

                document.getElementById('res-icon').innerText = data.isCorrect ? '🎯' : '❌';
                document.getElementById('res-title').innerText = data.isCorrect ? 'ออกแรงดึงสำเร็จ!' : 'พลาดท่า!';
                document.getElementById('res-power').innerText = `💪 +${data.power}`;
            }, 300);
        });
    </script>
</body>
</html>
