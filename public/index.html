<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Tug of War - Player Screen</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Kanit', sans-serif; background: #0b0f19; color: white; height: 100vh; width: 100vw; overflow: hidden; display: flex; flex-direction: column; }

        /* ส่วนหัว PIN และ TIMER */
        .top-bar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .pin-pill { font-family: 'Orbitron', sans-serif; font-size: 1.1em; color: #000; background: #facc15; padding: 6px 16px; border-radius: 20px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .timer-pill { font-family: 'Orbitron', sans-serif; font-size: 1.5em; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-weight: 900; }

        /* สนามแข่งขันหลัก ท็อปวิวถอดแบบรูปภาพ */
        .stage-viewport { position: relative; width: 100%; height: 100vh; background: #4d9e00; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .grass-top { position: absolute; top: 0; left: 0; right: 0; height: 22%; background: #4d9e00; border-bottom: 4px solid #3b7a00; }
        .grass-bottom { position: absolute; bottom: 0; left: 0; right: 0; height: 22%; background: #4d9e00; border-top: 4px solid #3b7a00; }
        .dirt-path { position: absolute; top: 22%; bottom: 22%; left: 0; right: 0; background: #8b4513; border-top: 5px solid #5c2e0b; border-bottom: 5px solid #5c2e0b; }
        
        .center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #ffffff; transform: translateX(-50%); border-left: 2px dashed #dc2626; z-index: 4; }

        /* เลื่อนสนามเชือกตามการดึง */
        .rope-slider { position: absolute; top: 50%; left: 0; width: 200vw; margin-left: -50vw; height: 100px; transform: translateY(-50%) translateX(0); transition: transform 0.2s linear; z-index: 5; }
        .rope-texture { position: absolute; top: 50%; left: 0; right: 0; height: 18px; transform: translateY(-50%); background: repeating-linear-gradient(45deg, #d4a373, #d4a373 8px, #a8794d 8px, #a8794d 16px); box-shadow: 0 6px 12px rgba(0,0,0,0.5); z-index: 5; }
        .knot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 34px; height: 34px; background: #dc2626; border-radius: 6px; border: 3px solid #fff; z-index: 6; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        /* ตัวละครดึงเชือกท็อปวิว */
        .player-top-down { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; transition: left 0.3s ease; }
        .player-head { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #111; box-shadow: 0 6px 10px rgba(0,0,0,0.5); background-image: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.5), transparent); position: relative; }
        .red-team .player-head { background-color: #ef4444; } 
        .blue-team .player-head { background-color: #3b82f6; }
        
        .player-hands { display: flex; gap: 22px; position: absolute; z-index: 8; }
        .hand { width: 13px; height: 13px; border-radius: 50%; background: #fcd34d; border: 2px solid #92400e; }
        
        .pos-top { top: calc(50% - 38px); } 
        .pos-bottom { top: calc(50% + 5px); }
        .red-team .player-hands { left: 26px; } 
        .blue-team .player-hands { right: 26px; }

        .player-name { position: absolute; background: rgba(0,0,0,0.85); padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); color: white; }
        .pos-top .player-name { top: -22px; } 
        .pos-bottom .player-name { bottom: -22px; }

        /* ไฮไลท์ออร่าตัวละครของตัวเอง (YOU) */
        .is-me .player-head { border: 3px solid #facc15 !important; box-shadow: 0 0 15px #facc15, 0 8px 15px rgba(0,0,0,0.6) !important; }
        .you-badge { position: absolute; background: #facc15; color: #000; font-size: 10px; font-weight: 900; padding: 1px 6px; border-radius: 8px; border: 1px solid #000; white-space: nowrap; z-index: 15; }
        .pos-top .you-badge { top: -38px; }
        .pos-bottom .you-badge { bottom: -38px; }

        @keyframes pull-red { 0% { transform: translateX(0); } 50% { transform: translateX(-16px); } 100% { transform: translateX(0); } }
        @keyframes pull-blue { 0% { transform: translateX(0); } 50% { transform: translateX(16px); } 100% { transform: translateX(0); } }
        .pulling.red-team { animation: pull-red 0.25s ease; } 
        .pulling.blue-team { animation: pull-blue 0.25s ease; }

        /* ปุ่มกดเข้าร่วมทีมด้านล่างแบบถอดแบบ */
        .bottom-join-bar { position: absolute; bottom: 20px; left: 15px; right: 15px; display: flex; gap: 12px; z-index: 60; }
        .btn-join-team { flex: 1; padding: 16px 10px; font-size: 1.2em; font-family: 'Kanit'; font-weight: 900; border: none; border-radius: 16px; color: white; cursor: pointer; transition: 0.1s; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .btn-join-team:active { transform: translateY(4px); }
        .btn-join-red { background: linear-gradient(180deg, #ff4d4d, #dc2626); box-shadow: 0 5px 0 #991b1b, 0 8px 15px rgba(0,0,0,0.4); }
        .btn-join-blue { background: linear-gradient(180deg, #3b82f6, #1d4ed8); box-shadow: 0 5px 0 #1e40af, 0 8px 15px rgba(0,0,0,0.4); }

        /* ป็อบอัพฟอร์มกรอกชื่อ / คำถาม / ผลลัพธ์ */
        .modal-overlay { position: fixed; inset: 0; background: rgba(11, 15, 25, 0.92); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 100; text-align: center; }
        .card { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; padding: 25px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }

        input { width: 100%; padding: 14px; font-size: 1.1em; font-family: 'Kanit'; font-weight: bold; border-radius: 14px; border: 2px solid #38bdf8; background: rgba(0,0,0,0.5); color: #fff; margin-bottom: 12px; text-align: center; outline: none; }

        /* กล่องโจทย์คำถามลอยเหนือสนาม */
        .quiz-overlay { position: absolute; bottom: 15px; left: 12px; right: 12px; background: rgba(15, 23, 42, 0.95); border: 2px solid #38bdf8; border-radius: 20px; padding: 15px; z-index: 70; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; }
        .q-title { font-size: 1.15em; font-weight: bold; margin-bottom: 12px; text-align: center; color: #fff; }
        .grid-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-choice { background: #1e293b; border: 2px solid #475569; color: white; padding: 14px 8px; font-size: 1em; font-family: 'Kanit'; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.1s; }
        .btn-choice:active { transform: scale(0.96); }
        .btn-choice.selected { background: #facc15; color: #000; border-color: #fff; }

        /* ข้อความสถานะรอ Host */
        .waiting-badge { position: absolute; bottom: 85px; background: rgba(0,0,0,0.85); padding: 8px 20px; border-radius: 20px; font-size: 1.1em; font-weight: bold; color: #00ffcc; border: 1px solid rgba(0,255,204,0.3); z-index: 55; }
    </style>
</head>
<body>

    <!-- แถบด้านบนแสดง PIN และ Timer -->
    <div class="top-bar">
        <div class="pin-pill" id="display-pin">PIN: ------</div>
        <div class="timer-pill" id="timer">60</div>
    </div>

    <!-- สนามแข่งท็อปวิวเหมือนภาพถ่าย -->
    <div class="stage-viewport">
        <div class="grass-top"></div>
        <div class="dirt-path"></div>
        <div class="grass-bottom"></div>
        <div class="center-line"></div>

        <div class="rope-slider" id="rope-slider">
            <div class="rope-texture"></div>
            <div class="knot"></div>
            <div id="players-container"></div>
        </div>

        <div class="waiting-badge" id="wait-status">⏳ รอ Host กดเริ่มแข่ง...</div>

        <!-- ปุ่มกดเปลี่ยนทีมด้านล่างแบบถอดแบบรูปภาพ -->
        <div class="bottom-join-bar" id="bottom-join-bar">
            <button class="btn-join-team btn-join-red" onclick="switchTeamDirect('RED')">🔴 เข้าร่วม RED</button>
            <button class="btn-join-team btn-join-blue" onclick="switchTeamDirect('BLUE')">🔵 เข้าร่วม BLUE</button>
        </div>
    </div>

    <!-- หน้าต่างลงทะเบียนครั้งแรก / เลือกทีมรอบใหม่ -->
    <div class="modal-overlay" id="join-modal">
        <div class="card">
            <h2 style="color: #38bdf8; margin-bottom: 15px;" id="modal-title">🎮 สมรภูมิดึงเชือก</h2>
            <input type="number" id="pin-input" placeholder="กรอกรหัส PIN 6 หลัก" maxlength="6">
            <input type="text" id="name-input" placeholder="ตั้งชื่อตัวละคร..." maxlength="12">
            <p style="margin-bottom: 12px; font-weight: bold;">เลือกทีมประจำการ</p>
            <div style="display: flex; gap: 10px;">
                <button class="btn-join-team btn-join-red" onclick="submitJoin('RED')">🔴 TEAM RED</button>
                <button class="btn-join-team btn-join-blue" onclick="submitJoin('BLUE')">🔵 TEAM BLUE</button>
            </div>
        </div>
    </div>

    <!-- ป็อบอัพโจทย์คำถามขึ้นมาลอยทับสนามแข่ง -->
    <div class="quiz-overlay" id="quiz-overlay">
        <div class="q-title" id="q-text">กำลังโหลดคำถาม...</div>
        <div class="grid-choices">
            <button class="btn-choice" id="c0" onclick="sendAns(0)">A</button>
            <button class="btn-choice" id="c1" onclick="sendAns(1)">B</button>
            <button class="btn-choice" id="c2" onclick="sendAns(2)">C</button>
            <button class="btn-choice" id="c3" onclick="sendAns(3)">D</button>
        </div>
    </div>

    <!-- หน้าต่างตกรอบ -->
    <div class="modal-overlay" id="eliminated-modal" style="display: none;">
        <div class="card">
            <h1 style="font-size: 4em;">💀</h1>
            <h2 style="color: #ef4444; font-size: 2em; margin-bottom: 10px;">คุณตกรอบแล้ว!</h2>
            <p style="color: #cbd5e1; font-size: 1.1em;">ขอบคุณที่มาร่วมสนุกในศึกชักเยอร์ครั้งนี้นะครับ</p>
        </div>
    </div>

    <!-- หน้าต่างผู้รอดชีวิตคนสุดท้าย -->
    <div class="modal-overlay" id="champion-modal" style="display: none;">
        <div class="card" style="border-color: #facc15; box-shadow: 0 0 30px rgba(250,204,21,0.5);">
            <h1 style="font-size: 5em;">🏆</h1>
            <h2 style="color: #facc15; font-size: 2.2em; margin-bottom: 10px;">THE GRAND CHAMPION</h2>
            <p style="color: white; font-size: 1.2em;">ยินดีด้วย! คุณคือผู้รอดชีวิตคนสุดท้าย!</p>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoomCode = '';
        let mySocketId = '';
        let isRejoining = false;

        socket.on('connect', () => { mySocketId = socket.id; });

        function submitJoin(team) {
            if (isRejoining) {
                socket.emit('rejoin_team', { roomCode: currentRoomCode, team });
            } else {
                const pin = document.getElementById('pin-input').value;
                const name = document.getElementById('name-input').value;
                if (!pin || pin.length !== 6) return alert('กรอกรหัส PIN 6 หลักก่อนครับ!');
                if (!name.trim()) return alert('กรอกชื่อตัวละครก่อนครับ!');

                currentRoomCode = pin;
                socket.emit('join_room', { roomCode: pin, name, team });
            }
        }

        function switchTeamDirect(targetTeam) {
            if (!currentRoomCode) return;
            socket.emit('switch_team_direct', { roomCode: currentRoomCode, targetTeam });
        }

        socket.on('join_error', (msg) => alert(msg));

        socket.on('join_success', (data) => {
            currentRoomCode = data.roomCode;
            document.getElementById('join-modal').style.display = 'none';
            document.getElementById('display-pin').innerText = `PIN: ${currentRoomCode}`;
        });

        socket.on('team_switched', (data) => {
            // สลับทีมสำเร็จ สนามจะอัปเดตอัตโนมัติผ่าน update_lobby
        });

        // เรนเดอร์ตัวละครทุกคนบนสนามแบบสลับฟันปลา Real-time
        socket.on('update_lobby', (data) => {
            const container = document.getElementById('players-container');
            container.innerHTML = '';

            data.players.forEach(p => {
                const isMe = (p.id === socket.id || p.id === mySocketId);
                const isTop = (p.slot % 2 === 0);
                
                const charDiv = document.createElement('div');
                charDiv.className = `player-top-down ${p.team === 'RED' ? 'red-team' : 'blue-team'} ${isTop ? 'pos-top' : 'pos-bottom'} ${isMe ? 'is-me' : ''}`;
                charDiv.id = `player-${p.id}`;

                const offset = 65 + (p.slot * 45);
                if (p.team === 'RED') {
                    charDiv.style.left = `calc(50% - ${offset}px)`;
                } else {
                    charDiv.style.left = `calc(50% + ${offset}px)`;
                }

                charDiv.innerHTML = `
                    ${isMe ? '<div class="you-badge">YOU</div>' : ''}
                    <div class="player-name">${p.name}</div>
                    <div class="player-hands"><div class="hand"></div><div class="hand"></div></div>
                    <div class="player-head"></div>
                `;
                container.appendChild(charDiv);
            });
        });

        socket.on('match_started', () => {
            document.getElementById('wait-status').style.display = 'none';
            document.getElementById('bottom-join-bar').style.display = 'none';
            document.getElementById('quiz-overlay').style.display = 'block';
            document.getElementById('rope-slider').style.transform = `translateY(-50%) translateX(0vw)`;
        });

        socket.on('timer_tick', (t) => {
            document.getElementById('timer').innerText = t < 10 ? `0${t}` : t;
        });

        socket.on('new_question', (qData) => {
            document.getElementById('q-text').innerText = qData.q;
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`c${i}`);
                btn.innerText = qData.choices[i];
                btn.disabled = false;
                btn.className = 'btn-choice';
            }
        });

        function sendAns(idx) {
            const qText = document.getElementById('q-text').innerText;
            socket.emit('submit_answer', { roomCode: currentRoomCode, answerIndex: idx, qText });
            for (let i = 0; i < 4; i++) document.getElementById(`c${i}`).disabled = true;
            document.getElementById(`c${idx}`).classList.add('selected');
        }

        socket.on('update_rope', (data) => {
            const slideVW = (data.ropePosition - 50) * 1.2;
            document.getElementById('rope-slider').style.transform = `translateY(-50%) translateX(${slideVW}vw)`;

            if (data.lastPuller) {
                const pEl = document.getElementById(`player-${data.lastPuller.id}`);
                if (pEl) {
                    pEl.classList.add('pulling');
                    setTimeout(() => pEl.classList.remove('pulling'), 250);
                }
            }
        });

        // ผ่านเข้ารอบ -> เลือกทีมใหม่
        socket.on('pick_team_again', () => {
            isRejoining = true;
            document.getElementById('quiz-overlay').style.display = 'none';
            document.getElementById('bottom-join-bar').style.display = 'none';
            document.getElementById('join-modal').style.display = 'flex';
            document.getElementById('pin-input').style.display = 'none';
            document.getElementById('name-input').style.display = 'none';
            document.getElementById('modal-title').innerText = '🔥 คุณเข้ารอบ! เลือกทีมลุยต่อ';
            document.getElementById('wait-status').style.display = 'block';
        });

        // แพ้ตกรอบ -> แสดงหน้าตกรอบ
        socket.on('eliminated', () => {
            document.getElementById('quiz-overlay').style.display = 'none';
            document.getElementById('eliminated-modal').style.display = 'flex';
        });

        // ได้แชมป์คนสุดท้าย
        socket.on('champion', () => {
            document.getElementById('quiz-overlay').style.display = 'none';
            document.getElementById('champion-modal').style.display = 'flex';
        });
    </script>
</body>
</html>
