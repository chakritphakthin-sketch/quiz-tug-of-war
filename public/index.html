<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Tug of War</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Kanit', sans-serif; background: #0b0f19; color: white; height: 100vh; overflow: hidden; }

        .ui-layer { position: absolute; inset: 0; z-index: 100; pointer-events: none; }
        .ui-content { pointer-events: auto; }

        .top-bar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; }
        .pin-pill { font-family: 'Orbitron'; font-size: 1.1em; color: #000; background: #facc15; padding: 6px 16px; border-radius: 20px; font-weight: 900; }
        .timer-pill { font-family: 'Orbitron'; font-size: 1.6em; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-weight: 900; }

        .waiting-badge { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 8px 20px; border-radius: 20px; font-size: 1.1em; font-weight: bold; color: #00ffcc; border: 1px solid rgba(0,255,204,0.3); white-space: nowrap; }

        .bottom-join-bar { position: absolute; bottom: 20px; left: 15px; right: 15px; display: flex; gap: 12px; }
        .btn-join-team { flex: 1; padding: 16px 10px; font-size: 1.2em; font-family: 'Kanit'; font-weight: 900; border: none; border-radius: 16px; color: white; cursor: pointer; transition: 0.1s; }
        .btn-join-team:active { transform: translateY(4px); }
        .btn-join-red { background: linear-gradient(180deg, #ff4d4d, #dc2626); box-shadow: 0 5px 0 #991b1b; }
        .btn-join-blue { background: linear-gradient(180deg, #3b82f6, #1d4ed8); box-shadow: 0 5px 0 #1e40af; }

        .quiz-overlay { position: absolute; bottom: 15px; left: 12px; right: 12px; background: rgba(15, 23, 42, 0.95); border: 2px solid #38bdf8; border-radius: 20px; padding: 15px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .q-title { font-size: 1.1em; font-weight: bold; margin-bottom: 12px; text-align: center; color: #fff; }
        .grid-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-choice { background: #1e293b; border: 2px solid #475569; color: white; padding: 14px 8px; font-size: 1em; font-family: 'Kanit'; font-weight: bold; border-radius: 12px; }
        .btn-choice.selected { background: #facc15; color: #000; border-color: #fff; }

        .stage-viewport { position: absolute; inset: 0; background: #4d9e00; overflow: hidden; z-index: 10; }
        .world-camera { position: absolute; inset: 0; transform-origin: center center; will-change: transform; }

        .grass-top { position: absolute; top: 0; left: -300vw; right: -300vw; height: 22vh; background: #4d9e00; border-bottom: 5px solid #3b7a00; }
        .grass-bottom { position: absolute; bottom: 0; left: -300vw; right: -300vw; height: 22vh; background: #4d9e00; border-top: 5px solid #3b7a00; }
        .dirt-path { position: absolute; top: 22vh; bottom: 22vh; left: -300vw; right: -300vw; background: #8b4513; border-top: 5px solid #5c2e0b; border-bottom: 5px solid #5c2e0b; }
        .center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #fff; transform: translateX(-50%); border-left: 2px dashed #dc2626; z-index: 4; }

        .rope-slider { position: absolute; left: 0; right: 0; top: 50%; height: 100px; transform: translateY(-50%); z-index: 5; will-change: transform; }
        .rope-texture { position: absolute; left: -300vw; right: -300vw; top: 50%; height: 16px; transform: translateY(-50%); background: repeating-linear-gradient(45deg, #d4a373, #d4a373 8px, #a8794d 8px, #a8794d 16px); box-shadow: 0 6px 12px rgba(0,0,0,0.5); z-index: 5; }
        .knot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 34px; height: 34px; background: #dc2626; border-radius: 6px; border: 3px solid #fff; z-index: 6; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        @keyframes rope-vibrate {
            0% { transform: translateY(-50%) translateX(0); }
            25% { transform: translateY(calc(-50% - 2px)) translateX(2px); }
            50% { transform: translateY(calc(-50% + 2px)) translateX(-2px); }
            75% { transform: translateY(calc(-50% - 2px)) translateX(1px); }
            100% { transform: translateY(-50%) translateX(0); }
        }
        .rope-slider.tension { animation: rope-vibrate 0.1s infinite; }

        .player-top-down { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; transition: left 0.3s ease; }
        .player-head { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #111; box-shadow: 0 6px 10px rgba(0,0,0,0.5); background-image: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.4), transparent); position: relative; z-index: 10; }
        .red-team .player-head { background-color: #ef4444; } .blue-team .player-head { background-color: #3b82f6; }

        .player-arms { position: absolute; width: 100%; height: 100%; z-index: 8; }
        .arm { position: absolute; width: 26px; height: 5px; background: #111; border-radius: 3px; box-shadow: 0 3px 5px rgba(0,0,0,0.6); }
        
        .pos-top { top: calc(50% - 40px); } 
        .pos-bottom { top: calc(50% + 5px); }

        .pos-top .arm.left-arm { top: 22px; left: -8px; transform: rotate(55deg); }
        .pos-top .arm.right-arm { top: 22px; right: -8px; transform: rotate(125deg); }
        .pos-bottom .arm.left-arm { bottom: 22px; left: -8px; transform: rotate(-55deg); }
        .pos-bottom .arm.right-arm { bottom: 22px; right: -8px; transform: rotate(-125deg); }

        @keyframes float-name { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }
        .player-name { position: absolute; background: rgba(0,0,0,0.85); padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); color: white; animation: float-name 1s infinite alternate ease-in-out; z-index: 15; }
        .pos-top .player-name { top: -26px; } .pos-bottom .player-name { bottom: -26px; }

        @keyframes pull-red { 0% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(-20px) rotate(-18deg); } 100% { transform: translateX(0) rotate(0deg); } }
        @keyframes pull-blue { 0% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(20px) rotate(18deg); } 100% { transform: translateX(0) rotate(0deg); } }
        .pulling.red-team { animation: pull-red 0.3s ease; } .pulling.blue-team { animation: pull-blue 0.3s ease; }

        .is-me .player-head { border: 3px solid #facc15 !important; box-shadow: 0 0 15px #facc15, 0 6px 10px rgba(0,0,0,0.5) !important; }
        .you-badge { position: absolute; background: #facc15; color: #000; font-size: 10px; font-weight: 900; padding: 1px 6px; border-radius: 8px; z-index: 20; border: 1px solid #000; animation: float-name 1s infinite alternate ease-in-out;}
        .pos-top .you-badge { top: -42px; } .pos-bottom .you-badge { bottom: -42px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(11,15,25,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 200; text-align: center; }
        .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 25px; width: 100%; max-width: 420px; }
        input { width: 100%; padding: 14px; font-size: 1.1em; font-family: 'Kanit'; font-weight: bold; border-radius: 14px; border: 2px solid #38bdf8; background: rgba(0,0,0,0.5); color: #fff; margin-bottom: 12px; text-align: center; outline: none; }
    </style>
</head>
<body>

    <div class="ui-layer" id="ui-layer">
        <div class="top-bar ui-content">
            <div class="pin-pill" id="display-pin">PIN: ------</div>
            <div class="timer-pill" id="timer">60</div>
        </div>
        <div class="waiting-badge ui-content" id="wait-status" style="display:none;">⏳ รอ Host กดเริ่ม...</div>

        <div class="bottom-join-bar ui-content" id="bottom-join-bar" style="display:none;">
            <button class="btn-join-team btn-join-red" onclick="switchTeamDirect('RED')">🔴 ร่วม RED</button>
            <button class="btn-join-team btn-join-blue" onclick="switchTeamDirect('BLUE')">🔵 ร่วม BLUE</button>
        </div>

        <div class="quiz-overlay ui-content" id="quiz-overlay">
            <div class="q-title" id="q-text">กำลังโหลดคำถาม...</div>
            <div class="grid-choices">
                <button class="btn-choice" id="c0" onclick="sendAns(0)">ก</button>
                <button class="btn-choice" id="c1" onclick="sendAns(1)">ข</button>
                <button class="btn-choice" id="c2" onclick="sendAns(2)" style="display:none;">ค</button>
                <button class="btn-choice" id="c3" onclick="sendAns(3)" style="display:none;">ง</button>
            </div>
        </div>
    </div>

    <div class="stage-viewport">
        <div class="world-camera" id="world-camera">
            <div class="grass-top"></div>
            <div class="dirt-path"></div>
            <div class="grass-bottom"></div>
            <div class="center-line"></div>

            <div class="rope-slider" id="rope-slider">
                <div class="rope-texture"></div>
                <div class="knot"></div>
                <div id="players-container"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="join-modal">
        <div class="card">
            <h2 style="color:#38bdf8; margin-bottom:15px;" id="modal-title">🎮 สมรภูมิดึงเชือก</h2>
            <input type="number" id="pin-input" placeholder="PIN 6 หลัก" maxlength="6">
            <input type="text" id="name-input" placeholder="ชื่อตัวละคร..." maxlength="12">
            <div style="display:flex; gap:10px;">
                <button class="btn-join-team btn-join-red" onclick="submitJoin('RED')">🔴 RED</button>
                <button class="btn-join-team btn-join-blue" onclick="submitJoin('BLUE')">🔵 BLUE</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="eliminated-modal" style="display:none;">
        <div class="card"><h1 style="font-size:4em;">💀</h1><h2 style="color:#ef4444;">ตกรอบ!</h2><p>ขอบคุณที่ร่วมสนุก</p></div>
    </div>

    <div class="modal-overlay" id="champion-modal" style="display:none;">
        <div class="card" style="border-color:#facc15;"><h1 style="font-size:5em;">🏆</h1><h2 style="color:#facc15;">CHAMPION</h2><p>ผู้รอดชีวิตคนสุดท้าย!</p></div>
    </div>

    <script>
        const socket = io();
        let currentRoomCode = '';
        let mySocketId = '';
        let isRejoining = false;

        let targetCameraX = 0;
        let currentCameraX = 0;
        let targetCameraScale = 1.1; 
        let currentCameraScale = 1.1;
        let myBaseOffsetPx = 0;
        let currentRopeShiftPx = 0;
        let isTrackingMe = false;

        socket.on('connect', () => { mySocketId = socket.id; });

        function renderCameraLoop() {
            currentCameraX += (targetCameraX - currentCameraX) * 0.08;
            currentCameraScale += (targetCameraScale - currentCameraScale) * 0.05;

            document.getElementById('world-camera').style.transform = `scale(${currentCameraScale}) translateX(${currentCameraX}px)`;
            requestAnimationFrame(renderCameraLoop);
        }
        requestAnimationFrame(renderCameraLoop);

        function submitJoin(team) {
            if (isRejoining) { socket.emit('rejoin_team', { roomCode: currentRoomCode, team }); } 
            else {
                const pin = document.getElementById('pin-input').value;
                const name = document.getElementById('name-input').value;
                if (!pin || !name.trim()) return alert('กรอกข้อมูลให้ครบ!');
                currentRoomCode = pin;
                socket.emit('join_room', { roomCode: pin, name, team });
            }
        }
        function switchTeamDirect(targetTeam) { if(currentRoomCode) socket.emit('switch_team_direct', { roomCode: currentRoomCode, targetTeam }); }

        socket.on('join_error', msg => alert(msg));
        socket.on('join_success', (data) => {
            currentRoomCode = data.roomCode;
            document.getElementById('join-modal').style.display = 'none';
            document.getElementById('display-pin').innerText = `PIN: ${currentRoomCode}`;
            document.getElementById('wait-status').style.display = 'block';
            document.getElementById('bottom-join-bar').style.display = 'flex';
        });

        socket.on('update_lobby', (data) => {
            const container = document.getElementById('players-container');
            container.innerHTML = '';
            let meFound = false;

            data.players.forEach(p => {
                const isMe = (p.id === socket.id || p.id === mySocketId);
                const isTop = (p.slot % 2 === 0);
                const offsetPx = 220 + (p.slot * 80);
                
                const charDiv = document.createElement('div');
                charDiv.className = `player-top-down ${p.team === 'RED' ? 'red-team' : 'blue-team'} ${isTop ? 'pos-top' : 'pos-bottom'} ${isMe ? 'is-me' : ''}`;
                charDiv.id = `player-${p.id}`;

                if (p.team === 'RED') charDiv.style.left = `calc(50% - ${offsetPx}px)`;
                else charDiv.style.left = `calc(50% + ${offsetPx}px)`;

                charDiv.innerHTML = `
                    ${isMe ? '<div class="you-badge">YOU</div>' : ''}
                    <div class="player-name">${p.name}</div>
                    <div class="player-arms"><div class="arm left-arm"></div><div class="arm right-arm"></div></div>
                    <div class="player-head"></div>
                `;
                container.appendChild(charDiv);

                if (isMe) {
                    meFound = true;
                    myBaseOffsetPx = (p.team === 'RED') ? -offsetPx : offsetPx;
                    isTrackingMe = true;
                    if(document.getElementById('quiz-overlay').style.display !== 'block') {
                        targetCameraX = -myBaseOffsetPx; 
                    }
                }
            });

            if(!meFound) isTrackingMe = false;
        });

        socket.on('match_started', () => {
            document.getElementById('wait-status').style.display = 'none';
            document.getElementById('bottom-join-bar').style.display = 'none';
            document.getElementById('quiz-overlay').style.display = 'block';
            targetCameraScale = 0.65;
        });

        socket.on('timer_tick', (t) => document.getElementById('timer').innerText = t < 10 ? `0${t}` : t);

        socket.on('new_question', (qData) => {
            document.getElementById('q-text').innerText = qData.q;
            const choicesCount = qData.choices.length;
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`c${i}`);
                if (i < choicesCount) {
                    btn.innerText = qData.choices[i];
                    btn.style.display = 'block';
                    btn.disabled = false;
                    btn.className = 'btn-choice';
                } else {
                    btn.style.display = 'none';
                }
            }
        });

        function sendAns(idx) {
            socket.emit('submit_answer', { roomCode: currentRoomCode, answerIndex: idx });
            for (let i = 0; i < 4; i++) document.getElementById(`c${i}`).disabled = true;
            document.getElementById(`c${idx}`).classList.add('selected');
        }

        socket.on('update_rope', (data) => {
            currentRopeShiftPx = (data.ropePosition - 50) * 15;
            const ropeEl = document.getElementById('rope-slider');
            ropeEl.style.transform = `translateY(-50%) translateX(${currentRopeShiftPx}px)`;

            if (isTrackingMe) {
                targetCameraX = -(myBaseOffsetPx + currentRopeShiftPx);
            }

            ropeEl.classList.add('tension');
            setTimeout(() => ropeEl.classList.remove('tension'), 200);

            if (data.lastPuller) {
                const pEl = document.getElementById(`player-${data.lastPuller.id}`);
                if (pEl) {
                    pEl.classList.add('pulling');
                    setTimeout(() => pEl.classList.remove('pulling'), 300);
                }
            }
        });

        socket.on('pick_team_again', () => {
            isRejoining = true;
            document.getElementById('quiz-overlay').style.display = 'none';
            document.getElementById('join-modal').style.display = 'flex';
            document.getElementById('pin-input').style.display = 'none';
            document.getElementById('name-input').style.display = 'none';
            document.getElementById('modal-title').innerText = '🔥 คุณเข้ารอบ! เลือกลุยต่อ';
            targetCameraScale = 1.1;
        });

        socket.on('eliminated', () => { document.getElementById('quiz-overlay').style.display = 'none'; document.getElementById('eliminated-modal').style.display = 'flex'; });
        socket.on('champion', () => { document.getElementById('quiz-overlay').style.display = 'none'; document.getElementById('champion-modal').style.display = 'flex'; });
    </script>
</body>
</html>
