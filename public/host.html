<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Quiz Tug of War - MAIN SCREEN</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #111; color: white; margin: 0; overflow: hidden; text-align: center; }
        .header { padding: 20px; font-size: 2em; font-weight: 900; background: #222; }
        .question-box { font-size: 3em; margin: 40px; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .timer { font-size: 5em; font-weight: 900; color: #f1c40f; margin-bottom: 20px; }
        
        .battle-arena { display: flex; justify-content: space-between; align-items: center; padding: 0 50px; position: relative; height: 300px; }
        .team-box { width: 300px; padding: 20px; border-radius: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .red-team { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .blue-team { background: linear-gradient(135deg, #3498db, #2980b9); }
        
        .team-title { font-size: 2.5em; font-weight: 900; }
        .stats { font-size: 1.5em; margin-top: 10px; }
        .power { font-size: 2.5em; font-weight: 900; color: #fff176; }

        .rope-container { position: absolute; left: 0; right: 0; top: 150px; display: flex; justify-content: center; z-index: 0; }
        .rope-track { width: 60%; height: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; position: relative; }
        .rope-mark { position: absolute; left: 50%; top: -10px; height: 40px; width: 4px; background: yellow; transform: translateX(-50%); }
        
        /* นี่คือตัวเชือกที่ขยับได้แบบ Real-time */
        .rope {
            position: absolute;
            font-size: 4em;
            top: -45px;
            left: 50%;
            /* อนิเมชันทำให้เชือกดึงแบบสมูท */
            transition: left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform: translateX(-50%);
            white-space: nowrap;
        }

        #host-controls { margin-top: 50px; }
        button { padding: 15px 40px; font-size: 1.5em; font-family: 'Kanit'; font-weight: bold; background: #2ecc71; color: white; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #27ae60; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="header">QUIZ TUG OF WAR 🏆</div>

    <div id="setup-screen">
        <h1 style="margin-top: 100px;">รอผู้เล่นเข้าห้อง...</h1>
        <div style="font-size: 2em;">
            🔴 ทีมแดง: <span id="lobby-red">0</span> คน | 
            🔵 ทีมน้ำเงิน: <span id="lobby-blue">0</span> คน
        </div>
        <div id="host-controls">
            <button onclick="startNextQuestion()">เริ่มคำถามข้อที่ 1</button>
        </div>
    </div>

    <div id="game-screen" style="display: none;">
        <div class="question-box" id="question-text">คำถามจะแสดงที่นี่?</div>
        <div class="timer" id="timer">15</div>

        <div class="battle-arena">
            <div class="team-box red-team">
                <div class="team-title">TEAM RED 🔴</div>
                <div class="stats">ตอบแล้ว: <span id="red-answered">0</span> คน</div>
                <div class="power">💪 <span id="red-power">0</span></div>
            </div>

            <div class="rope-container">
                <div class="rope-track">
                    <div class="rope-mark"></div>
                    <!-- เชือก -->
                    <div class="rope" id="rope">🔴 ═════🪢═════ 🔵</div>
                </div>
            </div>

            <div class="team-box blue-team">
                <div class="team-title">TEAM BLUE 🔵</div>
                <div class="stats">ตอบแล้ว: <span id="blue-answered">0</span> คน</div>
                <div class="power">💪 <span id="blue-power">0</span></div>
            </div>
        </div>

        <div id="host-controls-next" style="display: none;">
            <h1 id="winner-text" style="color: #f1c40f; font-size: 3em;"></h1>
            <button onclick="startNextQuestion()">เริ่มข้อต่อไป</button>
        </div>
    </div>

    <script>
        const socket = io();

        // อัปเดตตอนรอคน
        socket.on('update_lobby', (data) => {
            document.getElementById('lobby-red').innerText = data.redPlayers;
            document.getElementById('lobby-blue').innerText = data.bluePlayers;
        });

        function startNextQuestion() {
            socket.emit('start_question');
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('host-controls-next').style.display = 'none';
            document.getElementById('rope').style.left = '50%'; // รีเซ็ตเชือกตรงกลาง
            
            // รีเซ็ตค่าหน้าจอ
            document.getElementById('red-answered').innerText = '0';
            document.getElementById('blue-answered').innerText = '0';
        }

        // รับคำถามใหม่
        socket.on('new_question', (data) => {
            document.getElementById('question-text').innerText = `ข้อ ${data.questionIndex + 1}: ${data.questionData.q}`;
        });

        // เวลานับถอยหลัง
        socket.on('timer_tick', (timeLeft) => {
            document.getElementById('timer').innerText = timeLeft;
        });

        // 💥 ไฮไลท์! ขยับเชือก Real-time
        socket.on('update_rope', (data) => {
            // data.ropePosition = 0 (ซ้ายสุด) ถึง 100 (ขวาสุด)
            document.getElementById('rope').style.left = `${data.ropePosition}%`;
            document.getElementById('red-answered').innerText = data.redAnswered;
            document.getElementById('blue-answered').innerText = data.blueAnswered;
            document.getElementById('red-power').innerText = data.redTotalPower;
            document.getElementById('blue-power').innerText = data.blueTotalPower;
        });

        // จบข้อ
        socket.on('question_end', (data) => {
            document.getElementById('timer').innerText = "TIME'S UP!";
            document.getElementById('host-controls-next').style.display = 'block';
            document.getElementById('winner-text').innerText = `${data.winner} IS PULLING!`;
        });
    </script>
</body>
</html>
