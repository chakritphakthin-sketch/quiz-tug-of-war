<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Tug of War - Host</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { font-family: 'Kanit', sans-serif; background: #0b0f19; color: white; height: 100vh; overflow: hidden; }

        .ui-layer { position: absolute; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; }
        .ui-content { pointer-events: auto; }
        
        #lock-screen, #create-screen, #champion-screen { 
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0f19; z-index: 200; pointer-events: auto;
        }
        .btn-create { padding: 20px 40px; font-size: 2em; font-family: 'Kanit'; font-weight: 900; background: linear-gradient(90deg, #10b981, #059669); color: white; border-radius: 20px; cursor: pointer; border: none; }

        .header { background: rgba(0, 0, 0, 0.85); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .pin-badge { font-family: 'Orbitron'; font-size: 2.2em; color: #facc15; padding: 5px 20px; border-radius: 12px; border: 2px solid #facc15; }
        .host-btns { display: flex; gap: 12px; }
        .btn-bot, .btn-start { padding: 12px 20px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; color: white; font-family: 'Kanit'; font-size: 1.1em; }
        .bot-red { background: #dc2626; } .bot-blue { background: #2563eb; } .btn-start { background: #00c6ff; font-size: 1.3em; }

        .timer-box { font-family: 'Orbitron'; font-size: 5em; color: #00ffcc; text-align: center; margin-top: 10px; text-shadow: 0 0 20px #00ffcc; }
        .status-box { font-size: 1.8em; text-align: center; color: #facc15; font-weight: bold; }

        /* Camera Layer */
        .stage-viewport { position: absolute; inset: 0; background: #4d9e00; overflow: hidden; z-index: 10; }
        .world-camera { position: absolute; inset: 0; transform-origin: center center; will-change: transform; }

        .grass-top { position: absolute; top: 0; left: -300vw; right: -300vw; height: 22vh; background: #4d9e00; border-bottom: 8px solid #3b7a00; }
        .grass-bottom { position: absolute; bottom: 0; left: -300vw; right: -300vw; height: 22vh; background: #4d9e00; border-top: 8px solid #3b7a00; }
        .dirt-path { position: absolute; top: 22vh; bottom: 22vh; left: -300vw; right: -300vw; background: #8b4513; border-top: 6px solid #5c2e0b; border-bottom: 6px solid #5c2e0b; }
        .center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; background: #fff; transform: translateX(-50%); border-left: 3px dashed #dc2626; z-index: 4; }

        .rope-slider { position: absolute; left: 0; right: 0; top: 50%; height: 100px; transform: translateY(-50%); z-index: 5; will-change: transform; }
        .rope-texture { position: absolute; left: -300vw; right: -300vw; top: 50%; height: 20px; transform: translateY(-50%); background: repeating-linear-gradient(45deg, #d4a373, #d4a373 10px, #a8794d 10px, #a8794d 20px); box-shadow: 0 8px 15px rgba(0,0,0,0.6); z-index: 5; }
        .knot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 44px; height: 44px; background: #dc2626; border-radius: 8px; border: 4px solid #fff; z-index: 6; box-shadow: 0 4px 10px rgba(0,0,0,0.6); }

        /* อนิเมชั่นเชือกตึงสั่น */
        @keyframes rope-vibrate {
            0% { transform: translateY(-50%) translateX(0); }
            25% { transform: translateY(calc(-50% - 2px)) translateX(3px); }
            50% { transform: translateY(calc(-50% + 2px)) translateX(-3px); }
            75% { transform: translateY(calc(-50% - 2px)) translateX(2px); }
            100% { transform: translateY(-50%) translateX(0); }
        }
        .tension { animation: rope-vibrate 0.1s infinite; }

        /* ตัวละครและแขนเส้นดำ */
        .player-top-down { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; transition: left 0.3s ease; }
        .player-head { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #111; box-shadow: 0 8px 15px rgba(0,0,0,0.6); background-image: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.4), transparent); position: relative; z-index: 10; }
        .red-team .player-head { background-color: #ef4444; } .blue-team .player-head { background-color: #3b82f6; }

        .player-arms { position: absolute; width: 100%; height: 100%; z-index: 8; }
        .arm { position: absolute; width: 30px; height: 6px; background: #111; border-radius: 3px; box-shadow: 0 3px 6px rgba(0,0,0,0.5); }
        
        .pos-top { top: calc(50% - 45px); } 
        .pos-bottom { top: calc(50% + 5px); }
        
        /* มุมแขนพุ่งไปจับเชือก */
        .pos-top .arm.left-arm { top: 25px; left: -10px; transform: rotate(55deg); }
        .pos-top .arm.right-arm { top: 25px; right: -10px; transform: rotate(125deg); }
        .pos-bottom .arm.left-arm { bottom: 25px; left: -10px; transform: rotate(-55deg); }
        .pos-bottom .arm.right-arm { bottom: 25px; right: -10px; transform: rotate(-125deg); }

        /* ชื่อลอยอนิเมชั่น */
        @keyframes float-name { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
        .player-name { position: absolute; background: rgba(0,0,0,0.85); padding: 2px 10px; border-radius: 6px; font-size: 14px; font-weight: bold; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); color: white; animation: float-name 1s infinite alternate ease-in-out; z-index: 15; }
        .pos-top .player-name { top: -30px; } .pos-bottom .player-name { bottom: -30px; }

        /* อนิเมชั่นเอนตัวดึง */
        @keyframes pull-red { 0% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(-20px) rotate(-15deg); } 100% { transform: translateX(0) rotate(0deg); } }
        @keyframes pull-blue { 0% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(20px) rotate(15deg); } 100% { transform: translateX(0) rotate(0deg); } }
        .pulling.red-team { animation: pull-red 0.3s ease; } .pulling.blue-team { animation: pull-blue 0.3s ease; }

        .team-hud { position: absolute; bottom: 30px; font-size: 2.5em; font-weight: 900; z-index: 150; text-shadow: 0 5px 10px rgba(0,0,0,0.9); }
        .hud-red { left: 40px; color: #ef4444; } .hud-blue { right: 40px; color: #3b82f6; }
        .champ-title { font-size: 6em; font-weight: 900; background: linear-gradient(to right, #facc15, #f59e0b); -webkit-background-clip: text; color: transparent; text-shadow: 0 10px 30px rgba(250, 204, 21, 0.6); }
    </style>
</head>
<body>

    <div id="lock-screen"><h1 style="font-size: 3em;">🔒 ACCESS DENIED</h1><p>เฉพาะ Host เติม ?admin=true</p></div>
    <div id="create-screen" style="display:none;"><button class="btn-create" onclick="createRoom()">➕ สร้างห้อง</button></div>
    <div id="champion-screen" style="display:none;"><h2 style="font-size: 3em; color: white;">👑 THE GRAND CHAMPION 👑</h2><div class="champ-title" id="champ-name"></div></div>

    <!-- UI Overlay (ไม่ขยับตามกล้อง) -->
    <div class="ui-layer" id="ui-layer" style="display:none;">
        <div class="header ui-content">
            <div><span style="color: #94a3b8;">ROOM PIN:</span> <span class="pin-badge" id="display-pin">------</span></div>
            <div class="host-btns" id="host-controls">
                <button class="btn-bot bot-red" onclick="addBot('RED')">+ 🤖 แดง</button>
                <button class="btn-bot bot-blue" onclick="addBot('BLUE')">+ 🤖 น้ำเงิน</button>
                <button class="btn-start" onclick="startMatch()">🚀 เริ่มแข่ง!</button>
            </div>
        </div>
        <div class="timer-box ui-content" id="timer-box">60</div>
        <div class="status-box ui-content" id="status-box">รอคนเข้าห้อง...</div>
        <div class="team-hud hud-red ui-content">🔴 RED (<span id="red-count">0</span>)</div>
        <div class="team-hud hud-blue ui-content">BLUE 🔵 (<span id="blue-count">0</span>)</div>
    </div>

    <!-- โลกและกล้อง (ขยับ Zoom ได้) -->
    <div class="stage-viewport" id="arena-screen" style="display:none;">
        <div class="world-camera" id="world-camera">
            <div class="grass-top"></div>
            <div class="dirt-path"></div>
            <div class="grass-bottom"></div>
            <div class="center-line"></div>
            
            <div class="rope-slider" id="rope-slider">
                <div class="rope-texture"></div>
                <div class="knot"></div>
                <div id="players-container"></div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('create-screen').style.display = 'flex';
        }

        const socket = io();
        let currentRoomCode = '';
        let targetCameraScale = 0.85; 
        let currentCameraScale = 0.85;

        // Smooth Camera Loop สำหรับ Host (แค่ซูมเข้าซูมออก)
        function renderCamera() {
            currentCameraScale += (targetCameraScale - currentCameraScale) * 0.05;
            document.getElementById('world-camera').style.transform = `scale(${currentCameraScale})`;
            requestAnimationFrame(renderCamera);
        }
        requestAnimationFrame(renderCamera);

        function createRoom() { socket.emit('create_room'); }
        function addBot(team) { socket.emit('add_bot', { roomCode: currentRoomCode, team }); }
        function startMatch() { socket.emit('start_match', { roomCode: currentRoomCode }); document.getElementById('host-controls').style.display = 'none'; }

        socket.on('room_created', (data) => {
            currentRoomCode = data.roomCode;
            document.getElementById('create-screen').style.display = 'none';
            document.getElementById('arena-screen').style.display = 'block';
            document.getElementById('ui-layer').style.display = 'flex';
            document.getElementById('display-pin').innerText = currentRoomCode;
        });

        socket.on('update_lobby', (data) => {
            const container = document.getElementById('players-container');
            container.innerHTML = '';
            let redNum = 0; let blueNum = 0;

            data.players.forEach(p => {
                const charDiv = document.createElement('div');
                const isTop = (p.slot % 2 === 0);
                charDiv.className = `player-top-down ${p.team === 'RED' ? 'red-team' : 'blue-team'} ${isTop ? 'pos-top' : 'pos-bottom'}`;
                charDiv.id = `player-${p.id}`;

                // เว้นระยะห่างจากเชือกตรงกลางเยอะๆ (+250px)
                const offsetPx = 250 + (p.slot * 80);
                if (p.team === 'RED') { charDiv.style.left = `calc(50% - ${offsetPx}px)`; redNum++; } 
                else { charDiv.style.left = `calc(50% + ${offsetPx}px)`; blueNum++; }

                charDiv.innerHTML = `
                    <div class="player-name">${p.name}</div>
                    <div class="player-arms"><div class="arm left-arm"></div><div class="arm right-arm"></div></div>
                    <div class="player-head"></div>
                `;
                container.appendChild(charDiv);
            });
            document.getElementById('red-count').innerText = redNum; document.getElementById('blue-count').innerText = blueNum;
        });

        socket.on('match_started', () => {
            document.getElementById('status-box').innerText = "🔥 ลุยเลยยย!";
            targetCameraScale = 0.55; // Zoom out อัตโนมัติเมื่อเริ่มเกม ให้เห็นภาพกว้าง
        });

        socket.on('timer_tick', (t) => document.getElementById('timer-box').innerText = t < 10 ? `0${t}` : t);

        socket.on('update_rope', (data) => {
            const ropeShiftPx = (data.ropePosition - 50) * 20; // 1% = 20px
            const ropeEl = document.getElementById('rope-slider');
            ropeEl.style.transform = `translateY(-50%) translateX(${ropeShiftPx}px)`;

            // อนิเมชั่นสั่นเชือก
            ropeEl.classList.add('tension');
            setTimeout(() => ropeEl.classList.remove('tension'), 200);

            if (data.lastPuller) {
                const pEl = document.getElementById(`player-${data.lastPuller.id}`);
                if (pEl) { pEl.classList.add('pulling'); setTimeout(() => pEl.classList.remove('pulling'), 300); }
            }
        });

        socket.on('round_end', (data) => {
            targetCameraScale = 0.85; // ซูมกลับมารอคน
            document.getElementById('timer-box').innerText = "00";
            document.getElementById('status-box').innerText = `🏆 ทีม ${data.winningTeam} ชนะ! เลือกรอบต่อไป`;
            document.getElementById('host-controls').style.display = 'flex';
        });

        socket.on('champion', (data) => {
            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('arena-screen').style.display = 'none';
            document.getElementById('champion-screen').style.display = 'flex';
            document.getElementById('champ-name').innerText = data.name;
        });
    </script>
</body>
</html>
