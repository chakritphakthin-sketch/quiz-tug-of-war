<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Quiz Tug of War - Host</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: #0f172a; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        #create-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .btn-create { padding: 20px 40px; font-size: 2em; font-weight: 900; background: linear-gradient(90deg, #10b981, #059669); color: white; border: none; border-radius: 20px; cursor: pointer; }

        #arena-screen { display: none; flex-direction: column; height: 100vh; position: relative; }
        .header { background: rgba(0, 0, 0, 0.8); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .pin-badge { font-family: 'Orbitron', sans-serif; font-size: 2.2em; color: #facc15; }
        
        .btn-action { padding: 10px 20px; font-size: 1.2em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; margin-left: 10px; }
        .btn-bot { background: #8b5cf6; }
        .btn-start { background: #0ea5e9; }

        .round-info { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); text-align: center; z-index: 50; background: rgba(0,0,0,0.7); padding: 10px 30px; border-radius: 20px; border: 2px solid #38bdf8; }
        .round-timer { font-family: 'Orbitron', sans-serif; font-size: 3em; color: #facc15; }

        .stage-top-view { flex: 1; position: relative; background: #4d7c0f; overflow: hidden; border-top: 8px solid #3f6212; border-bottom: 8px solid #3f6212; }
        .dirt-path { position: absolute; top: 15%; bottom: 15%; left: 0; right: 0; background: #78350f; border-top: 6px solid #451a03; border-bottom: 6px solid #451a03; }
        .center-mark { position: absolute; left: 50%; top: 0; bottom: 0; width: 10px; background: rgba(255,255,255,0.8); transform: translateX(-50%); border-left: 2px dashed #dc2626; }

        .rope-slider { position: absolute; top: 50%; left: 0; width: 200vw; margin-left: -50vw; height: 120px; transform: translateY(-50%) translateX(0); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .rope-texture { position: absolute; top: 50%; left: 0; right: 0; height: 18px; transform: translateY(-50%); background: repeating-linear-gradient(45deg, #d4a373, #d4a373 8px, #a8794d 8px, #a8794d 16px); }
        .knot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 36px; height: 36px; background: #dc2626; border-radius: 5px; border: 3px solid #fff; }

        .player-top-down { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.1s; }
        .player-head { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #111; }
        .red-team .player-head { background-color: #ef4444; }
        .blue-team .player-head { background-color: #3b82f6; }
        .player-name { position: absolute; background: rgba(0,0,0,0.85); padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; white-space: nowrap; color: #fff;}
        .pos-top { top: calc(50% - 38px); }
        .pos-bottom { top: calc(50% + 5px); }
        .pos-top .player-name { top: -22px; }
        .pos-bottom .player-name { bottom: -22px; }

        /* แชมป์เปี้ยน Overlay */
        #champion-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .champ-title { font-size: 3em; color: #facc15; margin-bottom: 20px; }
        .champ-name { font-size: 6em; font-weight: 900; background: linear-gradient(90deg, #ff00cc, #333399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(255,0,204,0.5); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="create-screen">
        <h1 style="font-size: 3em; margin-bottom: 20px;">🎮 TOURNAMENT HOST</h1>
        <button class="btn-create" onclick="createRoom()">➕ สร้างห้องแข่งขัน</button>
    </div>

    <div id="arena-screen">
        <div class="header">
            <div>
                <span style="color: #94a3b8;">ROOM PIN:</span>
                <span class="pin-badge" id="display-pin">------</span>
            </div>
            <div>
                <button class="btn-action btn-bot" id="bot-btn" onclick="addBots()">🤖 เติมบอท 16v16</button>
                <button class="btn-action btn-start" id="start-btn" onclick="startMatch()">🚀 เริ่มแข่งรอบนี้</button>
            </div>
        </div>

        <div class="round-info" id="round-ui">
            <h2 id="round-text">ROUND 1</h2>
            <div class="round-timer" id="timer-box">60</div>
        </div>

        <div class="stage-top-view">
            <div class="dirt-path"></div>
            <div class="center-mark"></div>
            <div class="rope-slider" id="rope-slider">
                <div class="rope-texture"></div>
                <div class="knot"></div>
                <div id="players-container"></div>
            </div>
        </div>

        <div id="champion-overlay">
            <div class="champ-title">🏆 THE ULTIMATE CHAMPION 🏆</div>
            <div class="champ-name" id="champ-display-name">NAME</div>
            <p style="font-size: 1.5em; margin-top: 20px; color: #cbd5e1;">ผู้รอดชีวิตเพียงหนึ่งเดียวจากสมรภูมิ!</p>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoomCode = '';

        function createRoom() { socket.emit('create_room'); }
        function addBots() { socket.emit('add_bots', { roomCode: currentRoomCode }); }
        function startMatch() { 
            socket.emit('start_match', { roomCode: currentRoomCode }); 
            document.getElementById('bot-btn').style.display = 'none';
            document.getElementById('start-btn').style.display = 'none';
        }

        socket.on('room_created', (data) => {
            currentRoomCode = data.roomCode;
            document.getElementById('create-screen').style.display = 'none';
            document.getElementById('arena-screen').style.display = 'flex';
            document.getElementById('display-pin').innerText = currentRoomCode;
        });

        socket.on('update_lobby', (data) => {
            const container = document.getElementById('players-container');
            container.innerHTML = '';
            data.players.forEach(p => {
                if(!p.team) return; // ยังไม่เลือกทีม
                const charDiv = document.createElement('div');
                const posClass = (p.slot % 2 === 0) ? 'pos-top' : 'pos-bottom';
                charDiv.className = `player-top-down ${p.team === 'RED' ? 'red-team' : 'blue-team'} ${posClass}`;
                
                const offset = 70 + (p.slot * 48);
                if (p.team === 'RED') charDiv.style.left = `calc(50% - ${offset}px)`;
                else charDiv.style.left = `calc(50% + ${offset}px)`;

                charDiv.innerHTML = `<div class="player-name">${p.name}</div><div class="player-head"></div>`;
                container.appendChild(charDiv);
            });
        });

        socket.on('round_timer_tick', (t) => {
            document.getElementById('timer-box').innerText = t;
        });

        socket.on('update_rope', (data) => {
            const slideVW = (data.ropePosition - 50) * 1.2;
            document.getElementById('rope-slider').style.transform = `translateY(-50%) translateX(${slideVW}vw)`;
        });

        socket.on('round_summary', (data) => {
            document.getElementById('timer-box').innerText = "END";
            document.getElementById('round-text').innerText = `รอบต่อไป: ROUND ${data.round} (ผู้ชนะไปเลือกทีมใหม่)`;
            document.getElementById('bot-btn').style.display = 'inline-block';
            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('rope-slider').style.transform = `translateY(-50%) translateX(0vw)`;
        });

        socket.on('champion_found', (data) => {
            document.getElementById('champion-overlay').style.display = 'flex';
            document.getElementById('champ-display-name').innerText = data.name;
        });
    </script>
</body>
</html>
