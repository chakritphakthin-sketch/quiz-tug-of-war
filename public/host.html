<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Tug of War - Host Arena</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: radial-gradient(circle at center top, #1e293b, #020617); color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        #lock-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
        #create-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .btn-create { padding: 20px 50px; font-size: 2.5em; font-family: 'Kanit'; font-weight: 900; background: linear-gradient(180deg, #eab308, #a16207); color: #000; border: 4px solid #fef08a; border-radius: 12px; cursor: pointer; text-transform: uppercase; box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
        .btn-create:hover { transform: scale(1.05); }

        #arena-screen { display: none; flex-direction: column; height: 100vh; }
        .header { background: rgba(0, 0, 0, 0.8); padding: 10px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ca8a04; z-index: 100;}
        .pin-badge { font-family: 'Orbitron'; font-size: 2.5em; color: #facc15; background: rgba(250,204,21,0.1); padding: 5px 20px; border-radius: 8px; border: 2px dashed #facc15; min-width: 150px; text-align: center; letter-spacing: 5px;}
        .pin-hidden { color: #64748b; border-color: #475569; background: rgba(15,23,42,0.5); font-family: 'Kanit'; letter-spacing: normal;}

        .btn-start { padding: 12px 30px; font-size: 1.5em; font-weight: 900; background: #ef4444; color: white; border: 2px solid #fca5a5; border-radius: 8px; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 10px rgba(239,68,68,0.5);}
        .btn-start:hover { background: #dc2626; }

        .timer-display { font-family: 'Orbitron'; font-size: 3.5em; color: #facc15; text-shadow: 0 0 15px #ca8a04; }

        .host-quiz-panel { background: rgba(0,0,0,0.5); border: 2px solid #475569; margin: 15px 30px; padding: 15px 20px; border-radius: 12px; text-align: center; z-index: 100;}
        
        /* 2D Stage Design */
        .stage { flex: 1; position: relative; display: flex; justify-content: space-between; align-items: flex-end; overflow: hidden; }
        
        .platform-container { width: 42%; height: 50%; display: flex; flex-direction: column; position: relative; }
        
        .team-roster { position: absolute; bottom: calc(100% - 10px); width: 100%; display: flex; flex-wrap: wrap-reverse; align-content: flex-start; padding: 0 20px; z-index: 30;}
        .red-roster { justify-content: flex-end; flex-direction: row-reverse; }
        .blue-roster { justify-content: flex-start; flex-direction: row; }

        /* The Yellow Platforms */
        .platform-surface { width: 100%; height: 30px; background: #facc15; border-top: 6px solid #fef08a; border-bottom: 6px solid #a16207; position: absolute; bottom: calc(100% - 30px); z-index: 20; box-shadow: 0 15px 25px rgba(0,0,0,0.8); }
        .platform-truss { width: 100%; height: calc(100% - 30px); position: absolute; bottom: 0; background-color: #ca8a04; border-left: 8px solid #713f12; border-right: 8px solid #713f12; background-image: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(0,0,0,0.3) 20px, rgba(0,0,0,0.3) 40px), repeating-linear-gradient(-45deg, transparent, transparent 20px, rgba(0,0,0,0.3) 20px, rgba(0,0,0,0.3) 40px); }

        .chasm { position: absolute; left: 42%; right: 42%; bottom: 0; height: 100%; background: linear-gradient(to bottom, transparent, #000 80%); z-index: 5; }
        
        /* The Rope */
        .rope-system { position: absolute; bottom: calc(50% + 20px); left: 0; right: 0; height: 12px; z-index: 25; }
        .rope-line { width: 100%; height: 8px; background: #cbd5e1; border-top: 2px solid #f8fafc; border-bottom: 2px solid #64748b; box-shadow: 0 10px 15px rgba(0,0,0,0.8); position: relative; }
        .rope-knot { width: 20px; height: 36px; background: #ef4444; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); box-shadow: 0 0 15px #ef4444; border: 2px solid #fca5a5; border-radius: 2px; transition: left 0.2s linear; z-index: 26;}

        /* Player Sprites */
        .player-sprite { display: flex; flex-direction: column; align-items: center; width: 40px; margin: 0 -5px; position: relative; cursor: pointer; transition: transform 0.1s;}
        .player-sprite:hover { transform: scale(1.1); z-index: 40;}
        .player-sprite .name { font-size: 0.7em; color: #f8fafc; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; white-space: nowrap; max-width: 60px; overflow: hidden; text-overflow: ellipsis; position: absolute; top: -25px; border: 1px solid #475569;}
        .player-sprite .body { font-size: 2.5em; line-height: 1; filter: drop-shadow(2px 5px 5px rgba(0,0,0,0.8)); }
        .btn-kick { position: absolute; top: -45px; background: #ef4444; border: 1px solid #fff; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; display: none; z-index: 50; cursor:pointer;}
        .player-sprite:hover .btn-kick { display: block; }

        /* Team Headers hovering above */
        .team-info-float { position: absolute; top: 20%; width: 35%; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: rgba(0,0,0,0.6); border: 1px solid #334155; border-radius: 12px; z-index: 10;}
        .info-red { left: 3%; border-color: #be185d;}
        .info-blue { right: 3%; border-color: #047857;}
        .btn-add-bot { background: #334155; color: white; border: 1px solid #94a3b8; padding: 5px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-add-bot:hover { background: #475569; }

    </style>
</head>
<body>
    <div id="lock-screen"><h1 style="color:#ef4444;">🔒 เติม ?admin=true ท้าย URL</h1></div>
    <div id="create-screen"><button class="btn-create" onclick="createRoom()">สร้างหอคอยมรณะ</button></div>

    <div id="arena-screen">
        <div class="header">
            <div><span style="color: #94a3b8; font-weight:bold;">ROOM PIN:</span> <span class="pin-badge" id="display-pin">------</span></div>
            <div class="timer-display" id="timer-box">100</div>
            <div><button class="btn-start" id="start-btn" onclick="startMatch()">เริ่มเกมดึงเชือก</button></div>
        </div>
        <div class="host-quiz-panel"><h2 id="host-q-text" style="color:#facc15; font-size:1.8em;">รอผู้เล่นเข้าร่วม หรือกดเพิ่ม Bot...</h2></div>

        <div class="stage">
            <div class="team-info-float info-red">
                <h2 style="color:#fbcfe8;">🔺 RED (<span id="red-count">0</span>/<span class="max-limit">16</span>)</h2>
                <button class="btn-add-bot" onclick="addBot('RED')">🤖 +Bot</button>
            </div>
            
            <div class="team-info-float info-blue">
                <button class="btn-add-bot" onclick="addBot('BLUE')">🤖 +Bot</button>
                <h2 style="color:#6ee7b7;">BLUE 🟢 (<span id="blue-count">0</span>/<span class="max-limit">16</span>)</h2>
            </div>

            <!-- ซ้าย: RED -->
            <div class="platform-container">
                <div class="team-roster red-roster" id="red-slots"></div>
                <div class="platform-surface"></div>
                <div class="platform-truss"></div>
            </div>

            <div class="chasm"></div>
            
            <div class="rope-system"><div class="rope-line"><div class="rope-knot" id="knot"></div></div></div>
            
            <!-- ขวา: BLUE -->
            <div class="platform-container">
                <div class="team-roster blue-roster" id="blue-slots"></div>
                <div class="platform-surface"></div>
                <div class="platform-truss"></div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
            document.getElementById('lock-screen').style.display = 'none'; document.getElementById('create-screen').style.display = 'flex';
        }

        const socket = io(); 
        let currentRoomCode = '';
        let currentMaxPerTeam = 16;

        function createRoom() { socket.emit('create_room'); }
        socket.on('room_created', (data) => {
            currentRoomCode = data.roomCode;
            currentMaxPerTeam = data.maxPerTeam;
            document.getElementById('create-screen').style.display = 'none';
            document.getElementById('arena-screen').style.display = 'flex';
            document.getElementById('display-pin').innerText = currentRoomCode;
            document.querySelectorAll('.max-limit').forEach(el => el.innerText = currentMaxPerTeam);
        });

        function addBot(team) { socket.emit('add_bot', { roomCode: currentRoomCode, team }); }
        function kickPlayer(playerId) { socket.emit('kick_player', { roomCode: currentRoomCode, playerId }); }

        socket.on('update_lobby', (data) => {
            if(data.maxPerTeam) {
                currentMaxPerTeam = data.maxPerTeam;
                document.querySelectorAll('.max-limit').forEach(el => el.innerText = currentMaxPerTeam);
            }
            
            const redContainer = document.getElementById('red-slots');
            const blueContainer = document.getElementById('blue-slots');
            redContainer.innerHTML = ''; blueContainer.innerHTML = '';
            
            let redNum = 0, blueNum = 0;

            data.players.forEach(p => {
                if (!p.team) return;
                const container = p.team === 'RED' ? redContainer : blueContainer;
                const charEl = document.createElement('div');
                charEl.className = 'player-sprite';
                
                // ใช้ Emoji ธีมคนชุดชมพู(ผู้คุม) และ ชุดเขียว(ผู้เล่น)
                const isBotIcon = p.isBot ? '🤖' : (p.team === 'RED' ? '🦑' : '🏃');
                
                charEl.innerHTML = `
                    <button class="btn-kick" onclick="kickPlayer('${p.id}')">❌</button>
                    <div class="name">${p.name}</div>
                    <div class="body">${isBotIcon}</div>
                `;
                container.appendChild(charEl);

                if (p.team === 'RED') redNum++; if (p.team === 'BLUE') blueNum++;
            });
            document.getElementById('red-count').innerText = redNum; document.getElementById('blue-count').innerText = blueNum;
        });

        function startMatch() { socket.emit('start_match', { roomCode: currentRoomCode }); }
        socket.on('start_error', (msg) => alert(msg));
        
        socket.on('match_started', () => {
            document.getElementById('start-btn').style.display = 'none'; document.getElementById('knot').style.left = '50%';
            document.getElementById('host-q-text').innerText = "🔥 ดึงสุดแรงเพื่อเอาชีวิตรอด! 🔥";
        });

        socket.on('timer_tick', (t) => { document.getElementById('timer-box').innerText = t; });
        socket.on('update_rope', (data) => { document.getElementById('knot').style.left = `${data.ropePosition}%`; });

        socket.on('round_ended_survivors', (data) => {
            currentRoomCode = data.newRoomCode;
            currentMaxPerTeam = data.maxPerTeam;
            
            const pinBadge = document.getElementById('display-pin');
            pinBadge.innerText = '🔒 HIDDEN';
            pinBadge.classList.add('pin-hidden');

            document.getElementById('knot').style.left = '50%'; document.getElementById('timer-box').innerText = "100";
            document.getElementById('host-q-text').innerText = `🏁 จบรอบ! ทีมฝั่งตรงข้ามร่วงหล่น! ผู้รอดชีวิตกำลังเลือกทีมใหม่...`;
            document.getElementById('start-btn').style.display = 'inline-block'; document.getElementById('start-btn').innerText = "เริ่มรอบต่อไป";
            
            document.querySelectorAll('.max-limit').forEach(el => el.innerText = currentMaxPerTeam);
        });

        socket.on('champion_declared', (data) => {
            document.getElementById('host-q-text').innerHTML = `👑 ผู้รอดชีวิตเพียงหนึ่งเดียว: <span style="color:#fff;">${data.champName}</span> 🏆`;
            document.getElementById('start-btn').style.display = 'none';
        });
    </script>
</body>
</html>
