<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Quiz Tug of War - Top View Arena</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: #0f172a; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Secret Lock View & Create Screen (คงไว้เหมือนเดิม) */
        #lock-screen, #create-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; background: #0b0f19; }
        .lock-box { background: rgba(255,255,255,0.05); border: 2px solid #ef4444; padding: 40px; border-radius: 20px; box-shadow: 0 0 30px rgba(239,68,68,0.3); }
        .btn-create { padding: 20px 40px; font-size: 2em; font-family: 'Kanit'; font-weight: 900; background: linear-gradient(90deg, #10b981, #059669); color: white; border: none; border-radius: 20px; cursor: pointer; }

        /* Header & Question UI */
        #arena-screen { display: none; flex-direction: column; height: 100vh; }
        .header { background: rgba(0, 0, 0, 0.8); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .pin-badge { font-family: 'Orbitron', sans-serif; font-size: 2.2em; color: #facc15; background: rgba(250,204,21,0.1); padding: 5px 20px; border-radius: 12px; border: 2px solid #facc15; }
        .btn-start { padding: 12px 30px; font-size: 1.4em; font-weight: 900; background: linear-gradient(90deg, #00c6ff, #0072ff); color: white; border: none; border-radius: 12px; cursor: pointer; }
        
        .question-box { background: rgba(0,0,0,0.8); border: 2px solid #38bdf8; margin: 15px auto; padding: 20px 40px; border-radius: 20px; font-size: 2em; text-align: center; max-width: 85%; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .timer { font-family: 'Orbitron', sans-serif; font-size: 4em; color: #00ffcc; text-align: center; text-shadow: 0 0 20px #00ffcc; z-index: 50; margin-bottom: 10px; }

        /* Top View Field (สนามหญ้าและดิน) */
        .stage-top-view { flex: 1; position: relative; background: #4d7c0f; overflow: hidden; border-top: 8px solid #3f6212; border-bottom: 8px solid #3f6212; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
        
        /* รอยลากดินตรงกลาง */
        .dirt-path { position: absolute; top: 20%; bottom: 20%; left: 0; right: 0; background: #78350f; border-top: 6px solid #451a03; border-bottom: 6px solid #451a03; }
        .center-mark { position: absolute; left: 50%; top: 0; bottom: 0; width: 10px; background: rgba(255,255,255,0.8); transform: translateX(-50%); border-left: 2px dashed #dc2626; }

        /* เชือกและผู้เล่นแบบเลื่อนได้ (Slider) */
        .rope-slider { position: absolute; top: 50%; left: 0; width: 200vw; margin-left: -50vw; height: 100px; transform: translateY(-50%) translateX(0); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        
        /* เท็กเจอร์เชือก 3 มิติ */
        .rope-texture { position: absolute; top: 50%; left: 0; right: 0; height: 20px; transform: translateY(-50%); background: repeating-linear-gradient(45deg, #d4a373, #d4a373 8px, #a8794d 8px, #a8794d 16px); box-shadow: 0 15px 20px rgba(0,0,0,0.6), inset 0 3px 5px rgba(255,255,255,0.4); border-radius: 10px; }
        .knot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: #dc2626; border-radius: 5px; border: 3px solid #fff; box-shadow: 0 10px 15px rgba(0,0,0,0.5); }

        /* Top-Down Characters */
        .player-top-down { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; transition: transform 0.1s; }
        
        /* หัวและมือ */
        .player-head { width: 45px; height: 45px; border-radius: 50%; border: 4px solid #111; box-shadow: 0 15px 15px rgba(0,0,0,0.5); background-image: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.4), transparent); }
        .red-team .player-head { background-color: #ef4444; }
        .blue-team .player-head { background-color: #3b82f6; }
        
        .player-hands { display: flex; gap: 28px; position: absolute; z-index: 15; }
        .hand { width: 16px; height: 16px; border-radius: 50%; background: #fcd34d; border: 2px solid #92400e; box-shadow: 0 5px 5px rgba(0,0,0,0.5); }
        
        /* หันหน้าเข้าหากัน */
        .red-team .player-hands { left: 30px; } /* มือแดงจับเชือกด้านขวาของตัว */
        .blue-team .player-hands { right: 30px; } /* มือน้ำเงินจับเชือกด้านซ้ายของตัว */

        .player-name { position: absolute; top: -35px; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 6px; font-size: 14px; font-weight: bold; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); }

        /* แอนิเมชันตอนดึงเชือก */
        @keyframes pull-red { 0% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-50%) translateX(-25px); } 100% { transform: translateY(-50%) translateX(0); } }
        @keyframes pull-blue { 0% { transform: translateY(-50%) translateX(0); } 50% { transform: translateY(-50%) translateX(25px); } 100% { transform: translateY(-50%) translateX(0); } }
        .pulling.red-team { animation: pull-red 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .pulling.blue-team { animation: pull-blue 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .team-hud { position: absolute; bottom: 20px; font-size: 2em; font-weight: 900; text-shadow: 0 5px 10px rgba(0,0,0,0.8); z-index: 50; }
        .hud-red { left: 30px; color: #ef4444; }
        .hud-blue { right: 30px; color: #3b82f6; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-box">
            <h1 style="font-size: 3em; margin-bottom: 10px;">🔒 ACCESS DENIED</h1>
            <p style="font-size: 1.2em; color: #94a3b8;">เฉพาะ Host เท่านั้น! กรุณาเติม <code style="color:#facc15;">?admin=true</code> ท้าย URL</p>
        </div>
    </div>

    <div id="create-screen" style="display:none;">
        <h1 style="font-size: 3em; margin-bottom: 20px;">🎮 ARENA HOST CONTROL</h1>
        <button class="btn-create" onclick="createRoom()">➕ กดเพื่อสร้างห้องแข่งขันใหม่</button>
    </div>

    <div id="arena-screen">
        <div class="header">
            <div>
                <span style="font-size: 1.2em; color: #94a3b8;">ROOM PIN:</span>
                <span class="pin-badge" id="display-pin">------</span>
            </div>
            <div>
                <button class="btn-start" id="start-btn" onclick="startMatch()">🚀 กดเริ่มแข่งเลย!</button>
                <button class="btn-start" id="next-btn" onclick="nextQuestion()" style="display:none; background: #f59e0b;">ข้อถัดไป ➔</button>
            </div>
        </div>

        <div class="question-box" id="q-box">รอคนครบ แล้วกดเริ่มแข่งได้เลย...</div>
        <div class="timer" id="timer-box">15</div>

        <div class="stage-top-view">
            <div class="dirt-path"></div>
            <div class="center-mark"></div>
            
            <div class="rope-slider" id="rope-slider">
                <div class="rope-texture"></div>
                <div class="knot"></div>
                <!-- ผู้เล่นจะถูก Gen ใส่ในนี้ -->
                <div id="players-container"></div>
            </div>

            <div class="team-hud hud-red">🔴 RED TEAM (<span id="red-count">0</span>)</div>
            <div class="team-hud hud-blue">BLUE TEAM 🔵 (<span id="blue-count">0</span>)</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'true';
        let currentRoomCode = '';

        if (isAdmin) {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('create-screen').style.display = 'flex';
        }

        const socket = io();

        function createRoom() { socket.emit('create_room'); }

        socket.on('room_created', (data) => {
            currentRoomCode = data.roomCode;
            document.getElementById('create-screen').style.display = 'none';
            document.getElementById('arena-screen').style.display = 'flex';
            document.getElementById('display-pin').innerText = currentRoomCode;
        });

        // สร้างและจัดเรียงคนบนเชือก
        socket.on('update_lobby', (data) => {
            const container = document.getElementById('players-container');
            container.innerHTML = '';
            
            let redNum = 0; let blueNum = 0;

            data.players.forEach(p => {
                const charDiv = document.createElement('div');
                charDiv.className = `player-top-down ${p.team === 'RED' ? 'red-team' : 'blue-team'}`;
                charDiv.id = `player-avatar-${p.id}`;
                
                // คำนวณตำแหน่งยืนบนเชือก (ซ้าย-ขวา ห่างจากตรงกลาง 50%)
                // ทีมแดงไปซ้าย (-%) ทีมน้ำเงินไปขวา (+%)
                const offset = 80 + (p.slot * 50); // ระยะห่าง 50px ต่อ 1 คน
                if (p.team === 'RED') {
                    charDiv.style.left = `calc(50% - ${offset}px)`;
                    redNum++;
                } else {
                    charDiv.style.left = `calc(50% + ${offset}px)`;
                    blueNum++;
                }

                charDiv.innerHTML = `
                    <div class="player-name">${p.name}</div>
                    <div class="player-hands"><div class="hand"></div><div class="hand"></div></div>
                    <div class="player-head"></div>
                `;
                container.appendChild(charDiv);
            });

            document.getElementById('red-count').innerText = redNum;
            document.getElementById('blue-count').innerText = blueNum;
        });

        function startMatch() {
            socket.emit('start_match', { roomCode: currentRoomCode });
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        function nextQuestion() { socket.emit('next_question', { roomCode: currentRoomCode }); }

        socket.on('new_question', (data) => {
            document.getElementById('q-box').innerText = `ข้อที่ ${data.questionIndex + 1}: ${data.questionData.q}`;
            document.getElementById('rope-slider').style.transform = `translateY(-50%) translateX(0vw)`;
        });

        socket.on('timer_tick', (t) => {
            document.getElementById('timer-box').innerText = t < 10 ? `0${t}` : t;
        });

        // ลากเชือกสมจริง: เลื่อน Container ทั้งอันไปซ้ายหรือขวา
        socket.on('update_rope', (data) => {
            // ropePosition 50 = กลาง, ถ้าน้อยกว่า 50 (แดงชนะ) เชือกจะถูกดึงไปซ้าย (-)
            const slideVW = (data.ropePosition - 50) * 1.2; // คูณ 1.2 เพื่อให้เห็นระยะลากชัดขึ้น
            document.getElementById('rope-slider').style.transform = `translateY(-50%) translateX(${slideVW}vw)`;

            // แอนิเมชันกระตุกเฉพาะตัวคนที่เพิ่งตอบถูก
            if (data.lastPuller) {
                // ค้นหาคนที่เพิ่งดึงจาก DOM (ใช้วิธีหาจากชื่อ)
                const allPlayers = document.querySelectorAll('.player-top-down');
                allPlayers.forEach(el => {
                    if (el.innerText.includes(data.lastPuller.name)) {
                        el.classList.add('pulling');
                        setTimeout(() => el.classList.remove('pulling'), 300);
                    }
                });
            }
        });

        socket.on('question_end', (data) => {
            document.getElementById('timer-box').innerText = "หมดเวลา!";
            document.getElementById('q-box').innerText = `🏆 ทีม ${data.winner} ออกแรงดึงได้เยอะสุดรอบนี้!`;
        });

        socket.on('game_over', () => {
            document.getElementById('q-box').innerText = "🏁 จบการแข่งขันเรียบร้อยแล้ว!";
            document.getElementById('next-btn').style.display = 'none';
        });
    </script>
</body>
</html>
