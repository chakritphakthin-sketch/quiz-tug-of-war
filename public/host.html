<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Quiz Tug of War - Host Arena</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: #0f172a; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        #lock-screen, #create-screen, #champion-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; background: #0b0f19; z-index: 100; position: absolute; width: 100%; }
        .lock-box { background: rgba(255,255,255,0.05); border: 2px solid #ef4444; padding: 40px; border-radius: 20px; box-shadow: 0 0 30px rgba(239,68,68,0.3); }
        .btn-create { padding: 20px 40px; font-size: 2em; font-weight: 900; background: linear-gradient(90deg, #10b981, #059669); color: white; border: none; border-radius: 20px; cursor: pointer; }

        #arena-screen { display: none; flex-direction: column; height: 100vh; }
        .header { background: rgba(0, 0, 0, 0.8); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; z-index: 50; }
        .pin-badge { font-family: 'Orbitron', sans-serif; font-size: 2.2em; color: #facc15; background: rgba(250,204,21,0.1); padding: 5px 20px; border-radius: 12px; border: 2px solid #facc15; }
        
        .bot-controls { display: flex; gap: 10px; align-items: center; }
        .btn-bot { padding: 10px 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
        .bot-red { background: #b91c1c; } .bot-blue { background: #1d4ed8; }
        .btn-start { padding: 12px 30px; font-size: 1.4em; font-weight: 900; background: linear-gradient(90deg, #00c6ff, #0072ff); color: white; border: none; border-radius: 12px; cursor: pointer; }

        .timer-box { font-family: 'Orbitron', sans-serif; font-size: 5em; color: #00ffcc; text-align: center; text-shadow: 0 0 20px #00ffcc; z-index: 50; margin: 20px 0; }
        .status-box { font-size: 2em; text-align: center; color: #facc15; z-index: 50; font-weight: bold; }

        .stage-top-view { flex: 1; position: relative; background: #4d7c0f; overflow: hidden; border-top: 8px solid #3f6212; border-bottom: 8px solid #3f6212; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
        .dirt-path { position: absolute; top: 15%; bottom: 15%; left: 0; right: 0; background: #78350f; border-top: 6px solid #451a03; border-bottom: 6px solid #451a03; }
        .center-mark { position: absolute; left: 50%; top: 0; bottom: 0; width: 10px; background: rgba(255,255,255,0.8); transform: translateX(-50%); border-left: 2px dashed #dc2626; }

        .rope-slider { position: absolute; top: 50%; left: 0; width: 200vw; margin-left: -50vw; height: 120px; transform: translateY(-50%) translateX(0); transition: transform 0.2s linear; }
        .rope-texture { position: absolute; top: 50%; left: 0; right: 0; height: 18px; transform: translateY(-50%); background: repeating-linear-gradient(45deg, #d4a373, #d4a373 8px, #a8794d 8px, #a8794d 16px); box-shadow: 0 10px 15px rgba(0,0,0,0.6); z-index: 5; }
        .knot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 36px; height: 36px; background: #dc2626; border-radius: 5px; border: 3px solid #fff; z-index: 6; }

        /* ตัวละครสลับฟันปลา */
        .player-top-down { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.1s; }
        .player-head { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #111; box-shadow: 0 10px 10px rgba(0,0,0,0.5); background-image: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.4), transparent); }
        .red-team .player-head { background-color: #ef4444; } .blue-team .player-head { background-color: #3b82f6; }
        .player-hands { display: flex; gap: 24px; position: absolute; z-index: 8; }
        .hand { width: 14px; height: 14px; border-radius: 50%; background: #fcd34d; border: 2px solid #92400e; }
        
        .pos-top { top: calc(50% - 38px); } .pos-bottom { top: calc(50% + 5px); }
        .red-team .player-hands { left: 26px; } .blue-team .player-hands { right: 26px; }

        .player-name { position: absolute; background: rgba(0,0,0,0.85); padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); }
        .pos-top .player-name { top: -22px; } .pos-bottom .player-name { bottom: -22px; }

        @keyframes pull-red { 0% { transform: translateX(0); } 50% { transform: translateX(-20px); } 100% { transform: translateX(0); } }
        @keyframes pull-blue { 0% { transform: translateX(0); } 50% { transform: translateX(20px); } 100% { transform: translateX(0); } }
        .pulling.red-team { animation: pull-red 0.3s ease; } .pulling.blue-team { animation: pull-blue 0.3s ease; }
        
        .team-hud { position: absolute; bottom: 20px; font-size: 2em; font-weight: 900; z-index: 50; text-shadow: 0 5px 10px rgba(0,0,0,0.8); }
        .hud-red { left: 30px; color: #ef4444; } .hud-blue { right: 30px; color: #3b82f6; }
        
        /* Champion Text */
        .champ-title { font-size: 6em; font-weight: 900; background: linear-gradient(to right, #facc15, #f59e0b); -webkit-background-clip: text; color: transparent; text-shadow: 0 10px 30px rgba(250, 204, 21, 0.5); animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-box">
            <h1 style="font-size: 3em; margin-bottom: 10px;">🔒 ACCESS DENIED</h1>
            <p style="font-size: 1.2em; color: #94a3b8;">เฉพาะ Host เท่านั้น! เติม <code style="color:#facc15;">?admin=true</code></p>
        </div>
    </div>

    <div id="create-screen" style="display:none;">
        <h1 style="font-size: 3em; margin-bottom: 20px;">🎮 ARENA HOST</h1>
        <button class="btn-create" onclick="createRoom()">➕ สร้างห้องแข่งขันใหม่</button>
    </div>

    <div id="champion-screen" style="display:none;">
        <h2 style="font-size: 3em; color: white;">👑 THE GRAND CHAMPION 👑</h2>
        <div class="champ-title" id="champ-name">PLAYER NAME</div>
    </div>

    <div id="arena-screen">
        <div class="header">
            <div>
                <span style="font-size: 1.2em; color: #94a3b8;">PIN:</span>
                <span class="pin-badge" id="display-pin">------</span>
            </div>
            <div class="bot-controls" id="host-controls">
                <button class="btn-bot bot-red" onclick="addBot('RED')">+ 🤖 บอทแดง</button>
                <button class="btn-bot bot-blue" onclick="addBot('BLUE')">+ 🤖 บอทน้ำเงิน</button>
                <button class="btn-start" onclick="startMatch()">🚀 เริ่มแข่ง 60 วิ!</button>
            </div>
        </div>

        <div class="timer-box" id="timer-box">60</div>
        <div class="status-box" id="status-box">รอคนเข้าห้อง และเลือกทีม...</div>

        <div class="stage-top-view">
            <div class="dirt-path"></div>
            <div class="center-mark"></div>
            
            <div class="rope-slider" id="rope-slider">
                <div class="rope-texture"></div>
                <div class="knot"></div>
                <div id="players-container"></div>
            </div>

            <div class="team-hud hud-red">🔴 RED (<span id="red-count">0</span>)</div>
            <div class="team-hud hud-blue">BLUE 🔵 (<span id="blue-count">0</span>)</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('create-screen').style.display = 'flex';
        }

        const socket = io();
        let currentRoomCode = '';

        function createRoom() { socket.emit('create_room'); }
        function addBot(team) { socket.emit('add_bot', { roomCode: currentRoomCode, team }); }
        function startMatch() { 
            socket.emit('start_match', { roomCode: currentRoomCode }); 
            document.getElementById('host-controls').style.display = 'none';
        }

        socket.on('room_created', (data) => {
            currentRoomCode = data.roomCode;
            document.getElementById('create-screen').style.display = 'none';
            document.getElementById('arena-screen').style.display = 'flex';
            document.getElementById('display-pin').innerText = currentRoomCode;
        });

        socket.on('update_lobby', (data) => {
            const container = document.getElementById('players-container');
            container.innerHTML = '';
            let redNum = 0; let blueNum = 0;

            data.players.forEach(p => {
                const charDiv = document.createElement('div');
                const isTop = (p.slot % 2 === 0);
                charDiv.className = `player-top-down ${p.team === 'RED' ? 'red-team' : 'blue-team'} ${isTop ? 'pos-top' : 'pos-bottom'}`;
                
                const offset = 70 + (p.slot * 48);
                if (p.team === 'RED') { charDiv.style.left = `calc(50% - ${offset}px)`; redNum++; } 
                else { charDiv.style.left = `calc(50% + ${offset}px)`; blueNum++; }

                charDiv.innerHTML = `<div class="player-name">${p.name}</div><div class="player-hands"><div class="hand"></div><div class="hand"></div></div><div class="player-head"></div>`;
                container.appendChild(charDiv);
            });
            document.getElementById('red-count').innerText = redNum;
            document.getElementById('blue-count').innerText = blueNum;
        });

        socket.on('match_started', () => {
            document.getElementById('status-box').innerText = "🔥 ดึงเลย! ตอบให้ไวที่สุด!";
            document.getElementById('rope-slider').style.transform = `translateY(-50%) translateX(0vw)`;
        });

        socket.on('timer_tick', (t) => {
            document.getElementById('timer-box').innerText = t < 10 ? `0${t}` : t;
        });

        socket.on('update_rope', (data) => {
            const slideVW = (data.ropePosition - 50) * 1.2;
            document.getElementById('rope-slider').style.transform = `translateY(-50%) translateX(${slideVW}vw)`;
            if (data.lastPuller) {
                document.querySelectorAll('.player-top-down').forEach(el => {
                    if (el.innerText.includes(data.lastPuller.name)) {
                        el.classList.add('pulling');
                        setTimeout(() => el.classList.remove('pulling'), 300);
                    }
                });
            }
        });

        socket.on('round_end', (data) => {
            document.getElementById('timer-box').innerText = "00";
            document.getElementById('status-box').innerText = `🏆 ทีม ${data.winningTeam} ชนะ! ผู้รอดชีวิต ${data.survivors} คน กรุณาเลือกทีมใหม่!`;
            document.getElementById('host-controls').style.display = 'flex';
        });

        socket.on('champion', (data) => {
            document.getElementById('arena-screen').style.display = 'none';
            document.getElementById('champion-screen').style.display = 'flex';
            document.getElementById('champ-name').innerText = data.name;
        });
    </script>
</body>
</html>
