<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Tug of War - Host Arena Master</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: #0b0f19; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        #lock-screen, #create-screen, #champion-screen { 
            position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center; background: #0b0f19; z-index: 100; 
        }
        .btn-create { padding: 20px 40px; font-size: 2em; font-family: 'Kanit'; font-weight: 900; background: linear-gradient(90deg, #10b981, #059669); color: white; border: none; border-radius: 20px; cursor: pointer; box-shadow: 0 10px 25px rgba(16,185,129,0.4); }

        #arena-screen { display: none; flex-direction: column; height: 100vh; position: relative; }
        
        .header { background: rgba(0, 0, 0, 0.85); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; z-index: 50; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .pin-badge { font-family: 'Orbitron', sans-serif; font-size: 2.2em; color: #facc15; background: rgba(250,204,21,0.1); padding: 5px 20px; border-radius: 12px; border: 2px solid #facc15; }
        
        .host-btns { display: flex; gap: 12px; align-items: center; }
        .btn-bot { padding: 12px 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; color: white; font-family: 'Kanit'; font-size: 1.1em; transition: 0.1s; }
        .btn-bot:active { transform: scale(0.95); }
        .bot-red { background: #dc2626; box-shadow: 0 4px 0 #991b1b; } 
        .bot-blue { background: #2563eb; box-shadow: 0 4px 0 #1e40af; }
        .btn-start { padding: 12px 30px; font-size: 1.3em; font-weight: 900; background: linear-gradient(90deg, #00c6ff, #0072ff); color: white; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #004080; }

        .timer-box { font-family: 'Orbitron', sans-serif; font-size: 5em; color: #00ffcc; text-align: center; text-shadow: 0 0 20px #00ffcc; z-index: 50; margin-top: 10px; }
        .status-box { font-size: 1.8em; text-align: center; color: #facc15; z-index: 50; font-weight: bold; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

        /* สนามท็อปวิวถอดแบบแท้ */
        .stage-top-view { flex: 1; position: relative; background: #4d9e00; overflow: hidden; border-top: 8px solid #3b7a00; border-bottom: 8px solid #3b7a00; display: flex; align-items: center; justify-content: center; }
        .dirt-path { position: absolute; top: 18%; bottom: 18%; left: 0; right: 0; background: #8b4513; border-top: 6px solid #5c2e0b; border-bottom: 6px solid #5c2e0b; }
        .center-mark { position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; background: #ffffff; transform: translateX(-50%); border-left: 3px dashed #dc2626; z-index: 4; }

        .rope-slider { position: absolute; top: 50%; left: 0; width: 200vw; margin-left: -50vw; height: 120px; transform: translateY(-50%) translateX(0); transition: transform 0.2s linear; z-index: 5; }
        .rope-texture { position: absolute; top: 50%; left: 0; right: 0; height: 20px; transform: translateY(-50%); background: repeating-linear-gradient(45deg, #d4a373, #d4a373 10px, #a8794d 10px, #a8794d 20px); box-shadow: 0 8px 15px rgba(0,0,0,0.6); z-index: 5; }
        .knot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 38px; height: 38px; background: #dc2626; border-radius: 6px; border: 3px solid #fff; z-index: 6; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        /* ตัวละครสลับฟันปลา บน-ล่าง */
        .player-top-down { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; transition: left 0.3s ease; }
        .player-head { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #111; box-shadow: 0 8px 12px rgba(0,0,0,0.6); background-image: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.5), transparent); }
        .red-team .player-head { background-color: #ef4444; } 
        .blue-team .player-head { background-color: #3b82f6; }
        
        .player-hands { display: flex; gap: 24px; position: absolute; z-index: 8; }
        .hand { width: 14px; height: 14px; border-radius: 50%; background: #fcd34d; border: 2px solid #92400e; }
        
        .pos-top { top: calc(50% - 40px); } 
        .pos-bottom { top: calc(50% + 5px); }
        .red-team .player-hands { left: 28px; } 
        .blue-team .player-hands { right: 28px; }

        .player-name { position: absolute; background: rgba(0,0,0,0.85); padding: 2px 8px; border-radius: 6px; font-size: 13px; font-weight: bold; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); color: white; }
        .pos-top .player-name { top: -24px; } 
        .pos-bottom .player-name { bottom: -24px; }

        @keyframes pull-red { 0% { transform: translateX(0); } 50% { transform: translateX(-18px); } 100% { transform: translateX(0); } }
        @keyframes pull-blue { 0% { transform: translateX(0); } 50% { transform: translateX(18px); } 100% { transform: translateX(0); } }
        .pulling.red-team { animation: pull-red 0.25s ease; } 
        .pulling.blue-team { animation: pull-blue 0.25s ease; }

        .team-hud { position: absolute; bottom: 20px; font-size: 2.2em; font-weight: 900; z-index: 50; text-shadow: 0 5px 10px rgba(0,0,0,0.9); }
        .hud-red { left: 30px; color: #ef4444; } 
        .hud-blue { right: 30px; color: #3b82f6; }

        .champ-title { font-size: 5.5em; font-weight: 900; background: linear-gradient(to right, #facc15, #f59e0b); -webkit-background-clip: text; color: transparent; text-shadow: 0 10px 30px rgba(250, 204, 21, 0.6); animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div style="background: rgba(255,255,255,0.05); border: 2px solid #ef4444; padding: 40px; border-radius: 20px;">
            <h1 style="font-size: 3em; margin-bottom: 10px;">🔒 ACCESS DENIED</h1>
            <p style="font-size: 1.2em; color: #94a3b8;">เฉพาะ Host เท่านั้น! เติม <code style="color:#facc15;">?admin=true</code> ท้าย URL</p>
        </div>
    </div>

    <div id="create-screen" style="display:none;">
        <h1 style="font-size: 3em; margin-bottom: 20px;">🎮 ARENA HOST MASTER</h1>
        <button class="btn-create" onclick="createRoom()">➕ สร้างห้องแข่งขันใหม่</button>
    </div>

    <div id="champion-screen" style="display:none;">
        <h2 style="font-size: 3em; color: white;">👑 THE GRAND CHAMPION 👑</h2>
        <div class="champ-title" id="champ-name">PLAYER NAME</div>
    </div>

    <div id="arena-screen">
        <div class="header">
            <div>
                <span style="font-size: 1.2em; color: #94a3b8;">ROOM PIN:</span>
                <span class="pin-badge" id="display-pin">------</span>
            </div>
            <div class="host-btns" id="host-controls">
                <button class="btn-bot bot-red" onclick="addBot('RED')">+ 🤖 บอททีมแดง</button>
                <button class="btn-bot bot-blue" onclick="addBot('BLUE')">+ 🤖 บอททีมน้ำเงิน</button>
                <button class="btn-start" onclick="startMatch()">🚀 เริ่มแข่ง 60 วินาที!</button>
            </div>
        </div>

        <div class="timer-box" id="timer-box">60</div>
        <div class="status-box" id="status-box">รอคนเข้าห้อง และเลือกทีม...</div>

        <div class="stage-top-view">
            <div class="dirt-path"></div>
            <div class="center-mark"></div>
            
            <div class="rope-slider" id="rope-slider">
                <div class="rope-texture"></div>
                <div class="knot"></div>
                <div id="players-container"></div>
            </div>

            <div class="team-hud hud-red">🔴 RED (<span id="red-count">0</span>)</div>
            <div class="team-hud hud-blue">BLUE 🔵 (<span id="blue-count">0</span>)</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('create-screen').style.display = 'flex';
        }

        const socket = io();
        let currentRoomCode = '';

        function createRoom() { socket.emit('create_room'); }
        function addBot(team) { socket.emit('add_bot', { roomCode: currentRoomCode, team }); }
        function startMatch() { 
            socket.emit('start_match', { roomCode: currentRoomCode }); 
            document.getElementById('host-controls').style.display = 'none';
        }

        socket.on('room_created', (data) => {
            currentRoomCode = data.roomCode;
            document.getElementById('create-screen').style.display = 'none';
            document.getElementById('arena-screen').style.display = 'flex';
            document.getElementById('display-pin').innerText = currentRoomCode;
        });

        socket.on('update_lobby', (data) => {
            const container = document.getElementById('players-container');
            container.innerHTML = '';
            let redNum = 0; let blueNum = 0;

            data.players.forEach(p => {
                const charDiv = document.createElement('div');
                const isTop = (p.slot % 2 === 0);
                charDiv.className = `player-top-down ${p.team === 'RED' ? 'red-team' : 'blue-team'} ${isTop ? 'pos-top' : 'pos-bottom'}`;
                charDiv.id = `player-${p.id}`;

                const offset = 70 + (p.slot * 48);
                if (p.team === 'RED') { charDiv.style.left = `calc(50% - ${offset}px)`; redNum++; } 
                else { charDiv.style.left = `calc(50% + ${offset}px)`; blueNum++; }

                charDiv.innerHTML = `
                    <div class="player-name">${p.name}</div>
                    <div class="player-hands"><div class="hand"></div><div class="hand"></div></div>
                    <div class="player-head"></div>
                `;
                container.appendChild(charDiv);
            });
            document.getElementById('red-count').innerText = redNum;
            document.getElementById('blue-count').innerText = blueNum;
        });

        socket.on('match_started', () => {
            document.getElementById('status-box').innerText = "🔥 ดึงเชือกเลย! ตอบคำถามให้ถูกต้องที่สุด!";
            document.getElementById('rope-slider').style.transform = `translateY(-50%) translateX(0vw)`;
        });

        socket.on('timer_tick', (t) => {
            document.getElementById('timer-box').innerText = t < 10 ? `0${t}` : t;
        });

        socket.on('update_rope', (data) => {
            const slideVW = (data.ropePosition - 50) * 1.2;
            document.getElementById('rope-slider').style.transform = `translateY(-50%) translateX(${slideVW}vw)`;
            if (data.lastPuller) {
                const pEl = document.getElementById(`player-${data.lastPuller.id}`);
                if (pEl) {
                    pEl.classList.add('pulling');
                    setTimeout(() => pEl.classList.remove('pulling'), 250);
                }
            }
        });

        socket.on('round_end', (data) => {
            document.getElementById('timer-box').innerText = "00";
            document.getElementById('status-box').innerText = `🏆 ทีม ${data.winningTeam} ชนะ! ผู้รอดชีวิต ${data.survivors} คน เลือกทีมเพื่อลุยต่อรอบที่ ${data.roundNumber}!`;
            document.getElementById('host-controls').style.display = 'flex';
        });

        socket.on('champion', (data) => {
            document.getElementById('arena-screen').style.display = 'none';
            document.getElementById('champion-screen').style.display = 'flex';
            document.getElementById('champ-name').innerText = data.name;
        });
    </script>
</body>
</html>
