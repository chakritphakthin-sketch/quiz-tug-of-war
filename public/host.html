<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Quiz Tug of War - Host Arena</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Kanit', sans-serif; background: radial-gradient(circle at center top, #1e1e38, #0a0a14); color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        #lock-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
        #create-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .btn-create { padding: 20px 40px; font-size: 2em; font-family: 'Kanit'; font-weight: 900; background: linear-gradient(90deg, #10b981, #059669); color: white; border: none; border-radius: 20px; cursor: pointer; }

        #arena-screen { display: none; flex-direction: column; height: 100vh; }
        .header { background: rgba(0, 0, 0, 0.6); padding: 10px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .pin-badge { font-family: 'Orbitron'; font-size: 2em; color: #facc15; background: rgba(250,204,21,0.1); padding: 5px 15px; border-radius: 12px; border: 2px solid #facc15; }

        .btn-start { padding: 10px 25px; font-size: 1.3em; font-weight: 900; background: linear-gradient(90deg, #00c6ff, #0072ff); color: white; border: none; border-radius: 12px; cursor: pointer; }

        .timer-display { font-family: 'Orbitron'; font-size: 3em; color: #00ffcc; text-shadow: 0 0 20px #00ffcc; }

        .host-quiz-panel { background: rgba(255,255,255,0.05); border: 2px dashed #facc15; margin: 10px 20px; padding: 12px 20px; border-radius: 16px; text-align: center; }
        
        .stage { flex: 1; display: flex; position: relative; }
        .cliff { width: 38%; height: 70%; position: absolute; bottom: 0; padding: 15px; display: flex; flex-direction: column; }
        .cliff-left { left: 0; background: linear-gradient(160deg, #ff2a5f, #7a001c); border-radius: 0 50px 0 0; }
        .cliff-right { right: 0; background: linear-gradient(-160deg, #00d2ff, #003a7a); border-radius: 50px 0 0 0; }

        .grid-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
        .slot-box { background: rgba(0,0,0,0.3); border: 1px dashed rgba(255,255,255,0.2); border-radius: 8px; height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.8em; }
        .slot-box.filled { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.4); }

        .chasm { position: absolute; left: 38%; right: 38%; height: 100%; background: #05050a; z-index: -1; }
        .rope-system { position: absolute; top: 40%; left: 5%; right: 5%; height: 20px; z-index: 20; }
        .rope-line { width: 100%; height: 14px; background: repeating-linear-gradient(45deg, #d4a373, #d4a373 10px, #a8794d 10px, #a8794d 20px); border-radius: 10px; position: relative; }
        .rope-knot { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 44px; height: 44px; background: #facc15; border-radius: 50%; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div id="lock-screen"><h1 style="color:#ef4444;">🔒 เติม ?admin=true ท้าย URL</h1></div>

    <div id="create-screen">
        <button class="btn-create" onclick="createRoom()">➕ สร้างห้องแข่งขัน</button>
    </div>

    <div id="arena-screen">
        <div class="header">
            <div><span style="color: #94a3b8;">ROOM PIN:</span> <span class="pin-badge" id="display-pin">------</span></div>
            <div class="timer-display" id="timer-box">100</div>
            <div><button class="btn-start" id="start-btn" onclick="startMatch()">🚀 เริ่มการแข่งขัน</button></div>
        </div>

        <div class="host-quiz-panel">
            <h2 id="host-q-text" style="color:#facc15;">รอผู้เล่นเข้าห้อง (แบ่งทีม 8v8 ได้เลย)</h2>
        </div>

        <div class="stage">
            <div class="cliff cliff-left">
                <h2>🔴 RED TEAM (<span id="red-count">0</span>)</h2>
                <div class="grid-slots" id="red-slots"></div>
            </div>
            <div class="chasm"></div>
            <div class="rope-system">
                <div class="rope-line"><div class="rope-knot" id="knot">⚡</div></div>
            </div>
            <div class="cliff cliff-right">
                <h2 style="text-align: right;">BLUE TEAM 🔵 (<span id="blue-count">0</span>)</h2>
                <div class="grid-slots" id="blue-slots"></div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('create-screen').style.display = 'flex';
        }

        const socket = io();
        let currentRoomCode = '';

        function createRoom() { socket.emit('create_room'); }

        socket.on('room_created', (data) => {
            currentRoomCode = data.roomCode;
            document.getElementById('create-screen').style.display = 'none';
            document.getElementById('arena-screen').style.display = 'flex';
            document.getElementById('display-pin').innerText = currentRoomCode;
            initSlots();
        });

        function initSlots() {
            renderEmptySlots('red-slots');
            renderEmptySlots('blue-slots');
        }

        function renderEmptySlots(containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const box = document.createElement('div');
                box.className = 'slot-box';
                box.id = `${containerId}-slot-${i}`;
                box.innerHTML = `<span style="opacity:0.2;">${i+1}</span>`;
                container.appendChild(box);
            }
        }

        socket.on('update_lobby', (data) => {
            initSlots();
            let redNum = 0, blueNum = 0;
            data.players.forEach(p => {
                if (!p.team) return;
                const prefix = p.team === 'RED' ? 'red-slots' : 'blue-slots';
                const slotBox = document.getElementById(`${prefix}-slot-${p.slot}`);
                if (slotBox) {
                    slotBox.className = 'slot-box filled';
                    slotBox.innerHTML = `<div>🏃‍♂️</div><div style="font-weight:bold;">${p.name}</div>`;
                }
                if (p.team === 'RED') redNum++;
                if (p.team === 'BLUE') blueNum++;
            });
            document.getElementById('red-count').innerText = redNum;
            document.getElementById('blue-count').innerText = blueNum;
        });

        function startMatch() { socket.emit('start_match', { roomCode: currentRoomCode }); }
        socket.on('start_error', (msg) => alert(msg));

        socket.on('match_started', () => {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('knot').style.left = '50%';
            document.getElementById('host-q-text').innerText = "🔥 การต่อสู้เริ่มขึ้นแล้ว! 🔥";
        });

        socket.on('timer_tick', (t) => { document.getElementById('timer-box').innerText = t; });
        socket.on('update_rope', (data) => { document.getElementById('knot').style.left = `${data.ropePosition}%`; });

        // เมื่อจบรอบและยังมีคนรอดชีวิต
        socket.on('round_ended_survivors', (data) => {
            document.getElementById('knot').style.left = '50%';
            document.getElementById('timer-box').innerText = "100";
            document.getElementById('host-q-text').innerText = `🏁 จบรอบ! ทีม ${data.winningTeam} ชนะ รอผู้รอดชีวิต ${data.remainingCount} คนเลือกทีมใหม่...`;
            document.getElementById('start-btn').style.display = 'inline-block';
            document.getElementById('start-btn').innerText = "🚀 เริ่มรอบต่อไป";
        });

        socket.on('champion_declared', (data) => {
            document.getElementById('host-q-text').innerHTML = `👑 ขอแสดงความยินดีกับผู้ชนะเลิศ: ${data.champName} 🏆`;
            document.getElementById('start-btn').style.display = 'none';
        });
    </script>
</body>
</html>
